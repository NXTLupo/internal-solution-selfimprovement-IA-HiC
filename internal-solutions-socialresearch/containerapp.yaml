properties:
  EnvironmentId: /subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP/providers/Microsoft.App/managedEnvironments/ENVIRONMENT_NAME
  configuration:
    ingress:
      external: true
      allowInsecure: false
      targetPort: 5173
    registries:
      - server: REGISTRY
        identity: "/subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ACR_with_pull_policy"
  identity:
    userAssignedIdentities:
      "/subscriptions/SUBSCRIPTION_ID/resourceGroups/RESOURCE_GROUP/providers/Microsoft.ManagedIdentity/userAssignedIdentities/ACR_with_pull_policy": {}
    type: UserAssigned

services:
  postgres:
    image: ${REGISTRY}/k8se/services/postgres:14
    ports:
    - 5432:5432
    # needed because the postgres container does not provide a healthcheck
    options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    
template:
    containers:
      - name: backend
        image: REGISTRY/social-research-backend:IMAGE_TAG_BACKEND
        resources:
          cpu: 3.0
          memory: 6Gi
        command: ["python", "-m", "run"]
        env:
          # - name: SECRET_KEY
          #   secretRef: secret-key
          - name: PORT
            value: "8081"
      - name: frontend
        image: REGISTRY/social-research-frontend:IMAGE_TAG_FRONTEND
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: NODE_ENV
            value: production
    scale:
      minReplicas: 0
      maxReplicas: 5
      rules:
        - name: http-scale-rule
          http:
            metadata:
              concurrentRequests: "10"
    # secrets:
    #   - name: secret-key
    #     value: ${{ secrets.SECRET_KEY }}