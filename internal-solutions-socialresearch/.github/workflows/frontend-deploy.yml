name: "Social Research Frontend Build & Deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

concurrency:
  group: frontend-build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  SUBSCRIPTION_ID: '${{ secrets.AZURE_SUBSCRIPTION_ID }}'
  REGISTRY: '${{ secrets.REGISTRY_LOGIN_SERVER_AIPLAYGROUND }}'
  RESOURCE_GROUP: '${{ secrets.RESOURCE_GROUP_AIPLAYGROUND }}'
  CONTAINER_APP_NAME: 'social-research-frontend'
  ENVIRONMENT_NAME: 'social-research-env'
  LOCATION: 'eastus2'
  FRONTEND_CONTAINERAPP_YAML_PATH: '${{ github.workspace }}/frontend-containerapp.yaml'
  COMMIT_SHA: '${{ github.sha }}'
  VITE_API_BASE_URL: '${{ secrets.VITE_API_BASE_URL }}'

jobs:
    build-and-deploy-frontend:
        runs-on: ubuntu-latest
        steps:
        # checkout the repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@v4
          
        - name: 'Login via Azure CLI'
          uses: azure/login@v2.3.0
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS_AIPLAYGROUND }}
            
        - name: 'Docker Login to ACR'
          run: |
            echo ${{ secrets.REGISTRY_PASSWORD_AIPLAYGROUND }} | docker login $REGISTRY --username ${{ secrets.REGISTRY_USERNAME_AIPLAYGROUND }} --password-stdin
            
        - name: 'Create .env file for Docker Compose'
          run: |
            echo "REGISTRY=$REGISTRY" >> .env
            echo "COMMIT_SHA=${COMMIT_SHA}" >> .env
            echo "NODE_ENV=production" >> .env
            echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" >> .env
            
        - name: 'Ensure Container App Environment exists'
          uses: azure/CLI@v2.1.0
          with:
            inlineScript: |
              ENV_ID=$(az containerapp env show \
                --name $ENVIRONMENT_NAME \
                --resource-group $RESOURCE_GROUP \
                --query id -o tsv 2>/dev/null || echo "")
              if [ -z "$ENV_ID" ]; then
                echo "Creating Container App Environment..."
                az containerapp env create \
                  --name $ENVIRONMENT_NAME \
                  --resource-group $RESOURCE_GROUP \
                  --location $LOCATION
              else
                echo "Container App Environment already exists."
              fi
              
        - name: 'Build frontend container'
          run: |
            docker compose -f compose.deploy.yml build frontend
            
        - name: 'Push frontend container'
          run: |
            docker compose -f compose.deploy.yml push frontend
            
        - name: 'Update frontend-containerapp.yaml placeholders'
          run: |
            sed -i "s|SUBSCRIPTION_ID|${SUBSCRIPTION_ID}|g" $FRONTEND_CONTAINERAPP_YAML_PATH
            sed -i "s|RESOURCE_GROUP|${RESOURCE_GROUP}|g" $FRONTEND_CONTAINERAPP_YAML_PATH
            sed -i "s|ENVIRONMENT_NAME|${ENVIRONMENT_NAME}|g" $FRONTEND_CONTAINERAPP_YAML_PATH
            sed -i "s|REGISTRY|${REGISTRY}|g" $FRONTEND_CONTAINERAPP_YAML_PATH
            sed -i "s|IMAGE_TAG|${COMMIT_SHA}|g" $FRONTEND_CONTAINERAPP_YAML_PATH

        - name: 'Deploy Frontend to Azure Container Apps'
          uses: azure/container-apps-deploy-action@v2
          with:
            resourceGroup: '${{ env.RESOURCE_GROUP }}'
            location: '${{ env.LOCATION }}'
            containerAppEnvironment: '${{ env.ENVIRONMENT_NAME }}'
            containerAppName: '${{ env.CONTAINER_APP_NAME }}'
            yamlConfigPath: '${{ env.FRONTEND_CONTAINERAPP_YAML_PATH }}'
            acrName: nxthumans
            acrUsername: '${{ secrets.REGISTRY_USERNAME_AIPLAYGROUND }}'
            acrPassword: '${{ secrets.REGISTRY_PASSWORD_AIPLAYGROUND }}'
            
        - name: 'Get Container App URL and Check Debug Endpoint'
          uses: azure/CLI@v2.1.0
          with:
            inlineScript: |
              echo "Getting the Container App URL..."
              APP_URL=$(az containerapp show --name $CONTAINER_APP_NAME --resource-group $RESOURCE_GROUP --query "properties.configuration.ingress.fqdn" -o tsv)
              
              if [ -z "$APP_URL" ]; then
                echo "❌ Could not retrieve Container App URL"
                exit 1
              fi
              
              echo "Container App URL: https://$APP_URL"
              echo "Debug endpoint: https://$APP_URL/debug/env"
              
              echo "Waiting for the app to be fully deployed (30 seconds)..."
              sleep 30
              
              echo "Checking debug endpoint..."
              # Use curl to check the debug endpoint and print the full response without filtering
              DEBUG_RESPONSE=$(curl -s "https://$APP_URL/debug/env")
              
              echo "Full response from debug endpoint (unmasked):"
              echo "$DEBUG_RESPONSE"

