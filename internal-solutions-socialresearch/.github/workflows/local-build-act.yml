on:
  workflow_dispatch:

name: "Social Research Local Build Test"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@main
          
        - name: 'Debug directory'
          run: |
            pwd
            ls -la
            
        - name: 'Build images'
          run: |
            docker compose version
            docker compose -f compose.deploy.yml build
          env:
            NODE_ENV: production 