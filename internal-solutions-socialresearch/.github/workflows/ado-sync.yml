name: Sync with Azure DevOps

on:
    workflow_dispatch:
    schedule:
        - cron: '0 8,20 * * 1-5'
    issues:
        types: [opened, closed, deleted, reopened, edited, labeled, unlabeled, assigned, unassigned]
    issue_comment:
        types: [created]

jobs:
  alert:
    runs-on: ubuntu-latest
    name: Sync workflow
    steps:       
    - uses: actions/checkout@v3
    - uses: a11smiles/GitSync@main
      env:     
        ado_token: '${{ secrets.AZURE_DEVOPS_PAT_WOODSON }}'
        github_token: '${{ secrets.GH_PAT_WOODSON }}'
        config_file: './.github/workflows/ado_sync_config.json'
