<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon declarations in proper order -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/svg+xml" href="/chart-favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/chart-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NXT Humans | Social Research Tool</title>
    <link rel="stylesheet" href="/static/nxt-humans-styles.css">
    <link rel="stylesheet" href="/static/nxt-header.css">
    <link rel="stylesheet" href="/static/app-header-thumbnails.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
      /* Fix for input text color */
      [style*="background-color: rgba(34,38,43,255)"] input,
      [style*="background-color: rgba(34,38,43,255)"] select {
        color: white !important;
      }
    </style>
  </head>
  <body>
    <header class="intelligence-augmentation-header">
        <div class="ia-container has-thumbnail">
            <div class="ia-content">
                <div class="ia-logo-section">
                    <img src="/static/nxt-humans-logo.png" alt="NXT HUMANS Logo" class="ia-logo-image">
                </div>
                <div class="ia-text-section">
                    <div class="ia-introducing">Intelligence Augmentation</div>
                    <div class="ia-main-text">
                        <div class="ia-intelligence">Social Research</div>
                        <div class="ia-augmentation">Analysis</div>
                    </div>
                </div>
            </div>
            <div class="ia-thumbnail-section">
                <img src="/Social_Research.gif" alt="Social Research Analytics Demo" class="ia-app-thumbnail" />
                <div class="ia-thumbnail-label">Analytics Demo</div>
            </div>
        </div>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    
    <!-- App GIF Controls -->
    <script src="/static/app-gif-controls.js"></script>
