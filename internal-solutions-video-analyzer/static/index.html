<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXT Humans | Video Transcriber</title>
    <!-- Favicon declarations in proper order -->
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/nxt-humans-styles.css">
    <link rel="stylesheet" href="/static/enhanced-styles.css">
    <link rel="stylesheet" href="/static/enhanced-components.css">
    <link rel="stylesheet" href="/static/nxt-header.css">
    <!-- <link rel="stylesheet" href="/static/app-header-thumbnails.css"> -->
    <style>
        body {
            font-family: 'Archivo', 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff;
            color: #141414;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Intelligence Augmentation Header */
        .intelligence-augmentation-header {
            background: #115054;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            z-index: 100;
            overflow: hidden;
            margin-bottom: 0;
        }

        .intelligence-augmentation-header::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(45deg, transparent 0%, rgba(253, 142, 46, 0.1) 30%, rgba(253, 142, 46, 0.2) 60%, rgba(253, 142, 46, 0.25) 100%);
            transform: skewX(-20deg) translateX(20%);
            z-index: 1;
        }

        .ia-container {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 2rem;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .ia-content {
            display: flex;
            align-items: center;
            gap: 3rem;
            width: 100%;
            justify-content: center;
        }

        .ia-logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ia-logo-image {
            width: 280px;
            height: auto;
            opacity: 1;
            filter: invert(1);
            object-fit: contain;
        }

        .ia-text-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .ia-introducing {
            font-size: 1.6rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.4rem;
            letter-spacing: 0.5px;
            font-family: 'Archivo', 'Inter', sans-serif;
        }

        .ia-main-text {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .ia-intelligence,
        .ia-augmentation {
            font-size: 4rem;
            font-weight: 200;
            line-height: 0.9;
            letter-spacing: -1.5px;
            font-family: 'Archivo', 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .ia-intelligence {
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
            margin-bottom: -0.3rem;
        }

        .ia-augmentation {
            color: #fd8e2e;
            -webkit-text-fill-color: #fd8e2e;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .ia-logo-image {
                width: 180px;
            }
        }

        @media (max-width: 480px) {
            .ia-logo-image {
                width: 140px;
            }
        }

        .card {
            background: #ffffff;
            border-radius: 4px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid #e5e5e5;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #caca20;
        }

        .card h2 {
            margin-top: 0;
            color: #141414;
            font-size: 1.5rem;
            font-weight: 200;
            border-bottom: 2px solid #e5e5e5;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .upload-form {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 300;
            color: #141414;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 2px;
            font-size: 1rem;
            color: #141414;
            transition: border-color 0.2s ease;
        }

        .form-control:focus {
            border-color: #caca20;
            outline: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Archivo', 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            height: 48px;
            transition: all 0.2s ease;
            outline: none;
            border: none;
            background: #caca20;
            color: #115054;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #fafafa;
            color: #141414;
            border: 1px solid #e5e5e5;
        }

        .btn-secondary:hover {
            background: #f0f0f0;
            border-color: #caca20;
            transform: translateY(-2px);
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            height: 10px;
            background: #fafafa;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
            border: 1px solid #e5e5e5;
        }

        .progress {
            height: 100%;
            background: #caca20;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #acacac;
        }

        .job-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .job-item {
            padding: 15px;
            border-bottom: 1px solid #e5e5e5;
            background: #fafafa;
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, background 0.2s ease;
            border: 1px solid #e5e5e5;
        }

        .job-item:hover {
            transform: translateY(-2px);
            background: #ffffff;
            border-color: #caca20;
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .job-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #141414;
        }

        .job-status {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-processing {
            background-color: rgba(255, 193, 7, 0.15);
            color: #b8860b;
            border: 1px solid rgba(255, 193, 7, 0.4);
        }

        .status-completed {
            background-color: rgba(40, 167, 69, 0.15);
            color: #1e7e34;
            border: 1px solid rgba(40, 167, 69, 0.4);
        }

        .status-failed {
            background-color: rgba(220, 53, 69, 0.15);
            color: #c82333;
            border: 1px solid rgba(220, 53, 69, 0.4);
        }

        .job-details {
            font-size: 0.9rem;
            color: #acacac;
            margin-bottom: 10px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .job-actions .btn {
            flex: 1;
            min-width: 140px;
            font-size: 11px;
            padding: 0 10px;
        }

        .transcript-container {
            background: #fafafa;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            display: none;
            border: 1px solid #e5e5e5;
            color: #525252;
            max-height: 400px;
            overflow-y: auto;
        }

        .back-to-launchpad {
            display: inline-block;
            margin-bottom: 20px;
            color: #acacac;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .back-to-launchpad:hover {
            color: #115054;
            background-color: #fafafa;
            transform: translateY(-2px);
        }

        .back-to-launchpad i {
            margin-right: 5px;
        }

        .tooltip {
            position: relative;
            display: inline-block;
        }

        .tooltip .tooltiptext {
            visibility: hidden;
            width: 200px;
            background-color: #141414;
            color: #ffffff;
            text-align: center;
            border-radius: 4px;
            padding: 5px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -100px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
            opacity: 1;
        }

        /* Tab styles */
        .tab-navigation {
            display: flex;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #acacac;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #115054;
            background-color: #fafafa;
        }

        .tab-btn.active {
            color: #115054;
            background-color: #fafafa;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #caca20;
        }

        .tab-content {
            display: none;
            padding-top: 10px;
        }

        .tab-content.active {
            display: block;
        }

        /* Download button styles */
        #transcriptActions {
            margin-bottom: 15px;
        }

        #downloadJsonBtn {
            background: #caca20;
            color: #115054;
            border: none;
            border-radius: 2px;
            padding: 0 15px;
            font-family: 'Archivo', 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            height: 48px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #downloadJsonBtn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        #downloadJsonBtn i {
            font-size: 16px;
        }

        /* NXT 2026 Design System — !important overrides */
        :root {
            --dark-bg: #ffffff !important;
            --dark-bg-gradient-1: #ffffff !important;
            --dark-bg-gradient-2: #fafafa !important;
        }

        .card h2 {
            font-weight: 200;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="intelligence-augmentation-header" role="banner">
        <div class="ia-container">
            <div class="ia-content">
                <div class="ia-logo-section">
                    <img src="/static/nxt-humans-logo.png" alt="NXT Humans Logo" aria-label="NXT Humans Logo" class="ia-logo-image" onerror="this.onerror=null; this.src='http://localhost:8000/static/nxt-humans-logo.png'">
                </div>
                <div class="ia-text-section">
                    <div class="ia-introducing">Intelligence Augmentation</div>
                    <div class="ia-main-text">
                        <div class="ia-intelligence">Video</div>
                        <div class="ia-augmentation">Transcription</div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <nav role="navigation" aria-label="Service navigation" style="background:#ffffff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e5e5;">
      <a href="http://localhost:8000" style="display:inline-flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;color:#525252;text-decoration:none;text-transform:uppercase;letter-spacing:0.05em;" aria-label="Back to Launchpad">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Launchpad
      </a>
      <span style="font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;color:#141414;text-transform:uppercase;letter-spacing:0.05em;">Video Transcriber</span>
    </nav>

    <div class="container" role="main">
        <div class="main-content">
            <div class="upload-section">
                <div class="card">
                    <h2>Transcribe Video</h2>
                    
                    <!-- Tab navigation -->
                    <div class="tab-navigation">
                        <button class="tab-btn active" data-tab="upload">Upload Video</button>
                        <button class="tab-btn" data-tab="youtube">YouTube URL</button>
                    </div>
                    
                    <!-- Upload video tab -->
                    <div id="upload-tab" class="tab-content active">
                        <form id="uploadForm" class="upload-form">
                            <div class="form-group">
                                <label for="videoFile">Select Video File</label>
                                <input type="file" id="videoFile" class="form-control" accept="video/*" required>
                            </div>
                            <button type="submit" class="btn">
                                <i class="fas fa-upload"></i> Upload & Analyze
                            </button>
                        </form>
                    </div>
                    
                    <!-- YouTube URL tab -->
                    <div id="youtube-tab" class="tab-content">
                        <form id="youtubeForm" class="upload-form">
                            <div class="form-group">
                                <label for="youtubeUrl">Enter YouTube URL</label>
                                <input type="url" id="youtubeUrl" class="form-control" placeholder="https://www.youtube.com/watch?v=..." required>
                            </div>
                            <button type="submit" class="btn">
                                <i class="fab fa-youtube"></i> Analyze YouTube Video
                            </button>
                        </form>
                    </div>
                    
                    <div id="progressContainer" class="progress-container">
                        <div class="progress-bar">
                            <div id="progressBar" class="progress"></div>
                        </div>
                        <div id="progressText" class="progress-text">Processing: 0%</div>
                    </div>
                </div>
                
                <div class="card">
                    <h2>Transcript Viewer</h2>
                    <div id="transcriptActions" style="display: none; margin-bottom: 10px;">
                        <button id="downloadJsonBtn" class="btn btn-secondary">
                            <i class="fas fa-download"></i> Download as JSON
                        </button>
                    </div>
                    <div id="transcriptContainer" class="transcript-container">
                        Select a completed job to view its transcript.
                    </div>
                </div>
            </div>
            
            <div class="jobs-section">
                <div class="card">
                    <h2>Processing Jobs</h2>
                    <div id="jobList" class="job-list">
                        <div class="job-item">
                            <div class="job-header">
                                <span class="job-title">Loading jobs...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get elements
            const uploadForm = document.getElementById('uploadForm');
            const youtubeForm = document.getElementById('youtubeForm');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const jobList = document.getElementById('jobList');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const transcriptActions = document.getElementById('transcriptActions');
            const downloadJsonBtn = document.getElementById('downloadJsonBtn');
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            // Setup tab switching
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons and contents
                    tabButtons.forEach(btn => btn.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    
                    // Add active class to current button and content
                    button.classList.add('active');
                    const tabId = button.getAttribute('data-tab');
                    document.getElementById(`${tabId}-tab`).classList.add('active');
                });
            });
            
            // Load jobs on page load
            fetchJobs();
            
            // Set up interval to refresh jobs
            setInterval(fetchJobs, 5000);
            
            // Handle file upload form submission
            uploadForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const videoFile = document.getElementById('videoFile').files[0];
                if (!videoFile) {
                    alert('Please select a video file');
                    return;
                }
                
                // Show progress
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = 'Uploading...';
                
                // Create form data
                const formData = new FormData();
                formData.append('file', videoFile);
                
                try {
                    // Upload the file
                    const response = await fetch('/upload-video', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // The file is on the server; the rest is processing
                        progressText.textContent = 'Processing: 0%';

                        // Start polling for progress updates
                        const jobId = data.job_id;
                        pollJobProgress(jobId);

                        // Refresh job list
                        fetchJobs();
                    } else {
                        alert('Error uploading video: ' + data.message);
                        progressContainer.style.display = 'none';
                    }
                } catch (error) {
                    alert('Error uploading video: ' + error.message);
                    progressContainer.style.display = 'none';
                }
            });
            
            // Handle YouTube URL form submission
            youtubeForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const youtubeUrl = document.getElementById('youtubeUrl').value;
                if (!youtubeUrl) {
                    alert('Please enter a YouTube URL');
                    return;
                }
                
                // Show progress
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.textContent = 'Analyzing YouTube video...';
                
                try {
                    // Send the YouTube URL for analysis
                    const response = await fetch('/analyze-youtube', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ url: youtubeUrl })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Start polling for progress updates
                        const jobId = data.job_id;
                        pollJobProgress(jobId);
                        
                        // Refresh job list
                        fetchJobs();
                    } else {
                        alert('Error analyzing YouTube video: ' + data.message);
                        progressContainer.style.display = 'none';
                    }
                } catch (error) {
                    alert('Error analyzing YouTube video: ' + error.message);
                    progressContainer.style.display = 'none';
                }
            });
            
            // Poll job progress
            function pollJobProgress(jobId) {
                const interval = setInterval(async () => {
                    try {
                        const response = await fetch(`/jobs/${jobId}`);
                        if (response.status === 404) {
                            // The service restarted and the in-flight job is gone
                            clearInterval(interval);
                            progressText.textContent = 'This job was interrupted by a service restart. Please upload the video again.';
                            fetchJobs();
                            return;
                        }
                        const job = await response.json();

                        // Update progress bar
                        progressBar.style.width = `${job.progress}%`;
                        progressText.textContent = job.stage ? `${job.stage}: ${job.progress}%` : `Processing: ${job.progress}%`;
                        
                        // If job is completed or failed, stop polling
                        if (job.status === 'completed' || job.status === 'failed') {
                            clearInterval(interval);
                            
                            if (job.status === 'completed') {
                                progressText.textContent = 'Processing completed!';
                            } else {
                                progressText.textContent = 'Processing failed: ' + (job.error || 'Unknown error');
                            }
                            
                            // Refresh job list
                            fetchJobs();
                        }
                    } catch (error) {
                        console.error('Error polling job progress:', error);
                    }
                }, 1000);
            }
            
            // Fetch all jobs
            async function fetchJobs() {
                try {
                    const response = await fetch('/jobs');
                    const data = await response.json();
                    
                    // Sort jobs by start time (newest first)
                    const jobs = data.jobs.sort((a, b) => {
                        return new Date(b.start_time) - new Date(a.start_time);
                    });
                    
                    // Render jobs
                    renderJobs(jobs);
                } catch (error) {
                    console.error('Error fetching jobs:', error);
                    jobList.innerHTML = `<div class="job-item">
                        <div class="job-header">
                            <span class="job-title">Error loading jobs</span>
                        </div>
                        <div class="job-details">
                            ${error.message}
                        </div>
                    </div>`;
                }
            }
            
            function escapeHtml(text) {
                return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            // Render jobs
            function renderJobs(jobs) {
                if (jobs.length === 0) {
                    jobList.innerHTML = `<div class="job-item">
                        <div class="job-header">
                            <span class="job-title">No jobs found</span>
                        </div>
                        <div class="job-details">
                            Upload a video to get started.
                        </div>
                    </div>`;
                    return;
                }
                
                jobList.innerHTML = '';
                
                jobs.forEach(job => {
                    // Determine status class
                    let statusClass = '';
                    switch (job.status) {
                        case 'processing':
                            statusClass = 'status-processing';
                            break;
                        case 'completed':
                            statusClass = 'status-completed';
                            break;
                        case 'failed':
                            statusClass = 'status-failed';
                            break;
                        default:
                            statusClass = 'status-unknown';
                    }
                    
                    // Format dates
                    const startDate = new Date(job.start_time).toLocaleString();
                    const endDate = job.end_time ? new Date(job.end_time).toLocaleString() : '';
                    
                    // Create job item
                    const jobItem = document.createElement('div');
                    jobItem.className = 'job-item';
                    jobItem.innerHTML = `
                        <div class="job-header">
                            <span class="job-title">${job.filename}</span>
                            <span class="job-status ${statusClass}">${job.status}</span>
                        </div>
                        <div class="job-details">
                            <div>Started: ${startDate}</div>
                            ${endDate ? `<div>Completed: ${endDate}</div>` : ''}
                            ${job.status === 'processing' ? `<div>${job.stage ? escapeHtml(job.stage) + ': ' : 'Progress: '}${job.progress}%</div>` : ''}
                            ${job.status === 'failed' && job.error ? `<div>Error: ${escapeHtml(job.error)}</div>` : ''}
                        </div>
                        <div class="job-actions">
                            ${job.status === 'completed' ? `
                                <button class="btn btn-secondary view-transcript" data-job-id="${job.id}">
                                    <i class="fas fa-file-alt"></i> View Transcript
                                </button>
                                <button class="btn btn-secondary download-json" data-job-id="${job.id}">
                                    <i class="fas fa-download"></i> Download JSON
                                </button>
                            ` : ''}
                        </div>
                    `;
                    
                    jobList.appendChild(jobItem);
                    
                    // Add event listeners to job action buttons
                    if (job.status === 'completed') {
                        // View transcript button
                        const viewTranscriptBtn = jobItem.querySelector('.view-transcript');
                        viewTranscriptBtn.addEventListener('click', () => {
                            viewTranscript(job.id);
                        });
                        
                        // Download JSON button
                        const downloadJsonBtn = jobItem.querySelector('.download-json');
                        downloadJsonBtn.addEventListener('click', () => {
                            downloadTranscriptJson(job.id);
                        });
                    }
                });
            }
            
            // View transcript
            let currentTranscriptData = null;
            let currentJobId = null;
            
            async function viewTranscript(jobId) {
                try {
                    currentJobId = jobId;
                    transcriptContainer.style.display = 'block';
                    transcriptContainer.textContent = 'Loading transcript...';
                    transcriptActions.style.display = 'none';
                    
                    const response = await fetch(`/transcript/${jobId}`);
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Store the transcript data for download
                        currentTranscriptData = data;
                        
                        // Display the transcript
                        transcriptContainer.textContent = data.transcript;
                        
                        // Show download actions
                        transcriptActions.style.display = 'block';
                    } else {
                        transcriptContainer.textContent = 'Error loading transcript: ' + data.message;
                        currentTranscriptData = null;
                    }
                } catch (error) {
                    transcriptContainer.textContent = 'Error loading transcript: ' + error.message;
                    currentTranscriptData = null;
                }
            }
            
            // Build a structured export payload. The /transcript/{job_id} response
            // now includes a sidecar-loaded {source, transcription, completed_at,
            // format_version} when available — preserve all of it. The legacy
            // "transcript" string (formatted .txt content) is kept so any existing
            // downstream consumer that depended on it still works.
            function buildTranscriptExport(data, jobId) {
                const payload = {
                    job_id: jobId,
                    format: 'json',
                    format_version: data.format_version || '1.0',
                    exported_at: new Date().toISOString()
                };
                if (data.completed_at) payload.completed_at = data.completed_at;
                if (data.source) payload.source = data.source;
                if (data.transcription) payload.transcription = data.transcription;
                payload.transcript = data.transcript || '';
                return payload;
            }

            // Download transcript as JSON
            downloadJsonBtn.addEventListener('click', () => {
                if (!currentTranscriptData) return;

                const jsonData = buildTranscriptExport(currentTranscriptData, currentJobId);
                const jsonString = JSON.stringify(jsonData, null, 2);
                
                // Create blob and download link
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                // Create temporary link and trigger download
                const a = document.createElement('a');
                a.href = url;
                a.download = `transcript_${currentJobId}.json`;
                document.body.appendChild(a);
                a.click();
                
                // Clean up
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
            
            // Function to download transcript JSON directly from job list
            async function downloadTranscriptJson(jobId) {
                try {
                    // Show loading indicator
                    const downloadBtn = document.querySelector(`.download-json[data-job-id="${jobId}"]`);
                    const originalText = downloadBtn.innerHTML;
                    downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
                    
                    // Fetch transcript data
                    const response = await fetch(`/transcript/${jobId}`);
                    const data = await response.json();
                    
                    if (response.ok) {
                        const jsonData = buildTranscriptExport(data, jobId);
                        const jsonString = JSON.stringify(jsonData, null, 2);
                        
                        // Create blob and download link
                        const blob = new Blob([jsonString], { type: 'application/json' });
                        const url = URL.createObjectURL(blob);
                        
                        // Create temporary link and trigger download
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `transcript_${jobId}.json`;
                        document.body.appendChild(a);
                        a.click();
                        
                        // Clean up
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        
                        // Reset button text
                        downloadBtn.innerHTML = originalText;
                    } else {
                        alert('Error loading transcript: ' + data.message);
                        downloadBtn.innerHTML = originalText;
                    }
                } catch (error) {
                    alert('Error downloading transcript: ' + error.message);
                    const downloadBtn = document.querySelector(`.download-json[data-job-id="${jobId}"]`);
                    if (downloadBtn) {
                        downloadBtn.innerHTML = '<i class="fas fa-download"></i> Download JSON';
                    }
                }
            }
        });
    </script>
