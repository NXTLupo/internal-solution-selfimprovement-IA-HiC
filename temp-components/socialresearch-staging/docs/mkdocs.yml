# https://squidfunk.github.io/mkdocs-material/reference/
dev_addr: '127.0.0.1:8123'
repo_url: https://github.com/NXT-Humans/internal-solutions-cr
theme:
  name: material
  logo: 'assets/NXT-Humans-Color-Logo.png'
  palette:
    primary: purple
  features:
    - navigation.indexes
site_name: 'NXT Humans: Social Research'
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg