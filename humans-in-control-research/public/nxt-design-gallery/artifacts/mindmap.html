<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Northeastern co-op placement, Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #FFFFFF; overflow: hidden; }
  body { font-family: 'Open Sans', sans-serif; color: #1A1A1A; position: relative; }
  .mm-frame { width: 1920px; height: 1080px; padding: 50px 60px 40px 60px; position: relative; }
  .mm-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 4px; padding-bottom: 14px; border-bottom: 1px solid #DDD; }
  .mm-kicker { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
  .mm-title { font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 38px; color: #0D0D0D; letter-spacing: 0.01em; line-height: 1.05; max-width: 1500px; }
  .mm-meta { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .mm-meta div { margin-bottom: 4px; }
  .mm-meta span { color: #B8B800; font-weight: 700; }
  .mm-canvas { position: relative; width: 100%; height: calc(100% - 96px); }
  .mm-legend { position: absolute; bottom: 12px; left: 60px; right: 60px; display: flex; gap: 28px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
  .mm-legend .mm-sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
  .mm-legend .mm-conv { background: #FFFFFF; border: 2px solid #0091B6; }
  .mm-legend .mm-grp { background: #FFFFFF; border: 2px solid #B8B800; }
  .mm-legend .mm-thin { background: #444; border: 1px solid #888; }
</style>
</head>
<body>
<div class="mm-frame">
  <header class="mm-header">
    <div>
      <div class="mm-kicker">Mind Map · NU</div>
      <h1 class="mm-title">Co-op placement friction, six clusters, three convergent across academic, news, and social sources</h1>
    </div>
    <div class="mm-meta">
      <div>Groups <span>4</span></div>
      <div>Themes <span>14</span></div>
      <div>Convergent <span>6</span></div>
    </div>
  </header>
  <div class="mm-canvas">
    <svg width="1800" height="900" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="display:block; margin: 0 auto;">

      <path d="M 960 570 Q 1200 720 1410 800" stroke="#888" stroke-width="1.5" fill="none" opacity="0.5"/>

      <!-- Edges from groups to themes -->
      <path d="M 510 410 L 250 330" stroke="#888" stroke-width="1" fill="none" opacity="0.35"/>

      <path d="M 510 410 L 540 240" stroke="#888" stroke-width="1" fill="none" opacity="0.35"/>

      <path d="M 1410 410 L 1700 330" stroke="#888" stroke-width="1" fill="none" opacity="0.35"/>

      <path d="M 510 800 L 280 940" stroke="#888" stroke-width="1" fill="none" opacity="0.35"/>

      <path d="M 1410 800 L 1380 990" stroke="#888" stroke-width="1" fill="none" opacity="0.35"/>

      <!-- ROOT -->
      <g>
        <circle cx="960" cy="570" r="80" fill="#B8B800" stroke="#B8B800" stroke-width="1"/>
        <text x="960" y="565" font-family="'Roboto Condensed', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">

          <tspan x="960" dy="22">friction</tspan>
        </text>
      </g>

      <!-- GROUP 1: Screening layer (convergent) -->
      <g>
        <circle cx="510" cy="410" r="62" fill="none" stroke="#0091B6" stroke-width="2" opacity="0.55"/>
        <circle cx="510" cy="410" r="56" fill="#FBF6F6" stroke="#B8B800" stroke-width="2"/>
        <text x="510" y="405" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" fill="#0D0D0D" text-anchor="middle">
          <tspan x="510" dy="-6">Screening</tspan>
          <tspan x="510" dy="16">layer fails</tspan>
        </text>
      </g>
      <!-- Themes under G1 -->
      <g><circle cx="250" cy="330" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="250" y="328" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="250" dy="-3">ATS keyword</tspan><tspan x="250" dy="13">over-filter</tspan></text></g>

      <g><circle cx="320" cy="220" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="320" y="218" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="320" dy="-3">Filter tuned</tspan><tspan x="320" dy="13">for seniors</tspan></text></g>

      <g>
        <circle cx="1410" cy="410" r="62" fill="none" stroke="#0091B6" stroke-width="2" opacity="0.55"/>

      <g><circle cx="1700" cy="330" r="36" fill="none" stroke="#0091B6" stroke-width="2" opacity="0.55"/><circle cx="1700" cy="330" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1700" y="328" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1700" dy="-3">Midterm</tspan><tspan x="1700" dy="13">load wk 5-8</tspan></text></g>
      <g><circle cx="1700" cy="480" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1700" y="478" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1700" dy="-3">48h offer</tspan><tspan x="1700" dy="13">in finals</tspan></text></g>
      <g><circle cx="1620" cy="230" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1620" y="228" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1620" dy="-3">Class skip</tspan><tspan x="1620" dy="13">for Zoom</tspan></text></g>
      <g><circle cx="1400" cy="200" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1400" y="198" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1400" dy="-3">Triage to 5</tspan><tspan x="1400" dy="13">applications</tspan></text></g>

      <!-- GROUP 3: Advisor capacity (thin in spots) -->
      <g>
        <circle cx="510" cy="800" r="56" fill="#FBF6F6" stroke="#B8B800" stroke-width="2"/>
        <text x="510" y="795" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" fill="#0D0D0D" text-anchor="middle">
          <tspan x="510" dy="-6">Advisor</tspan>
          <tspan x="510" dy="16">capacity</tspan>
        </text>
      </g>
      <g><circle cx="240" cy="760" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="240" y="758" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="240" dy="-3">20-min slot</tspan><tspan x="240" dy="13">3-week wait</tspan></text></g>
      <g><circle cx="280" cy="940" r="36" fill="#444" stroke="#888" stroke-width="1"/><text x="280" y="938" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle"><tspan x="280" dy="-3">First-gen</tspan><tspan x="280" dy="13">satisfaction</tspan></text></g>
      <g><circle cx="580" cy="980" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="580" y="978" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="580" dy="-3">Template</tspan><tspan x="580" dy="13">staleness</tspan></text></g>

      <!-- GROUP 4: Match outcomes (convergent) -->
      <g>
        <circle cx="1410" cy="800" r="62" fill="none" stroke="#0091B6" stroke-width="2" opacity="0.55"/>
        <circle cx="1410" cy="800" r="56" fill="#FBF6F6" stroke="#B8B800" stroke-width="2"/>
        <text x="1410" y="795" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" fill="#0D0D0D" text-anchor="middle">
          <tspan x="1410" dy="-6">Match</tspan>
          <tspan x="1410" dy="16">outcomes</tspan>
        </text>
      </g>
      <g><circle cx="1700" cy="760" r="36" fill="none" stroke="#0091B6" stroke-width="2" opacity="0.55"/><circle cx="1700" cy="760" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1700" y="758" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1700" dy="-3">38% first-</tspan><tspan x="1700" dy="13">cycle match</tspan></text></g>
      <g><circle cx="1680" cy="920" r="36" fill="#F5F5F0" stroke="#888" stroke-width="1"/><text x="1680" y="918" font-family="'Open Sans', sans-serif" font-size="11" font-weight="600" fill="#0D0D0D" text-anchor="middle"><tspan x="1680" dy="-3">Late-cycle</tspan><tspan x="1680" dy="13">cancels</tspan></text></g>

    </svg>

  <div class="mm-legend">
    <div><span class="mm-sw mm-conv"></span>Convergent evidence, appears in ≥2 source types</div>
    <div><span class="mm-sw mm-grp"></span>Theme group</div>
    <div><span class="mm-sw mm-thin"></span>Thin evidence, &lt;2 sources</div>
  </div>
</div>
</body>
</html>
