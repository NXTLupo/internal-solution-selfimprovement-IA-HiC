server {
    listen 5011;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must NEVER be cached — it contains the hashed asset references.
    # NOTE: the `location /` catch-all below serves index.html via try_files
    # without passing through this block, so we ALSO apply no-cache headers
    # in the catch-all using a regex match on the served path.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # 2026-06-12 — Chunks are CONTENT-HASHED again (vite.config.ts
    # chunkFileNames includes [hash]). The 2026-05-12 stable-name scheme
    # caused the "dual app boot" bug: a stale tab revalidated an un-hashed
    # chunk, received new-build content, and executed the entire new entry
    # bundle over the live session. Hashed URLs never change content, so
    # immutable caching is safe; changed chunks get new URLs and stale tabs
    # 404 into the ChunkLoadGuard banner (its designed UX).
    location /assets/chunks/ {
        types {
            application/javascript js mjs;
            text/css css;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Entry bundle + other hashed assets keep their content hashes in the
    # filename, so they are safe to cache as immutable for a year.
    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 2026-10-30 (WS-0 S1/S2) - runtime configuration for the SPA: proxy base + the
    # shared proxy token. Written by the research-proxy at startup into the shared
    # hic-workspace volume (.runtime/config.json); nothing is baked into the image.
    location = /config.json {
        alias /usr/share/nginx/html/hic-workspace/.runtime/config.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    # Serve DESIGN.md as plain text. Must be explicit — without this, the catch-all
    # location / serves index.html as fallback, which causes designMdLoader to
    # silently fail YAML parsing and hang on "Loading design tokens..." forever.
    location = /DESIGN.md {
        default_type text/plain;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 2026-10-30 (WS-0 S8) - client data is never served anonymously from this
    # origin. Sessions (chat, state, traces), uploads, sources and the derived
    # synthesis/evidence/engagement pages are read by the SPA through the
    # authenticated proxy (/api/sessions/*, /api/wiki/read). The runtime config
    # directory is reachable only through the /config.json alias above.
    location ~ ^/hic-workspace/(sessions|sources|prototypes|artifacts|\.runtime|skillopt|telemetry)(/|$) {
        return 404;
    }
    location ~ ^/hic-workspace/wiki/(uploads|synthesis|evidence|engagements|feedback|insights|user-selections)(/|$) {
        return 404;
    }

    # Serve wiki knowledge layer files for wikiService.ts (frameworks, brand,
    # anti-patterns, benchmarks, exemplars, inspiration-hub, design-system, eval).
    location /hic-workspace/wiki/ {
        types {
            text/markdown md;
        }
        default_type text/markdown;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Serve manifest JSONs (skill-manifest, institution-manifest, youtube-channels).
    # Must be defined BEFORE the catch-all `location /` — otherwise any unknown
    # path falls through to try_files's SPA fallback and serves index.html,
    # which breaks resp.json() in every manifest loader.
    location ~* ^/hic-workspace/.+\.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
