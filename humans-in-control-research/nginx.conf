server {
    listen 5011;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must NEVER be cached — it contains the hashed asset references.
    # NOTE: the `location /` catch-all below serves index.html via try_files
    # without passing through this block, so we ALSO apply no-cache headers
    # in the catch-all using a regex match on the served path.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # Hashed assets (filename contains content hash) are immutable — safe to cache
    location /assets/ {
        types {
            application/javascript js mjs;
            text/css css;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Serve wiki knowledge layer files for wikiService.ts
    location /hic-workspace/wiki/ {
        types {
            text/markdown md;
        }
        default_type text/markdown;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Serve manifest JSONs (skill-manifest, institution-manifest, youtube-channels).
    # Must be defined BEFORE the catch-all `location /` — otherwise any unknown
    # path falls through to try_files's SPA fallback and serves index.html,
    # which breaks resp.json() in every manifest loader.
    location ~* ^/hic-workspace/.+\.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
