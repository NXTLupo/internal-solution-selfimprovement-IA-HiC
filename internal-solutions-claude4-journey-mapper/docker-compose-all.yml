version: '3'

services:
  # Main Docker Compose configuration for the NXT Humans AI CX Workbench
  
  # Launchpad - Central hub with WebSocket proxy for agent communication
  launchpad:
    image: launchpad:latest
    container_name: launchpad
    ports:
      - "8000:8000"
    volumes:
      - ./launchpad/static:/app/static
      - ./launchpad/templates:/app/templates
    environment:
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:8080
      - CLAUDE4_JOURNEY_MAPPER_URL=http://claude4-journey-mapper:8000
      - CLAUDE4_JOURNEY_MAPPER_CLIENT_URL=http://localhost:8090
      - REDDIT_RIPPER_URL=http://reddit-ripper:5001
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:5001
      - VIDEO_ANALYZER_URL=http://video-analyzer:5002
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:5002
      - ENABLE_CX_AGENT=true
      - AGENT_WS_URL=ws://agent:8500
      - AGENT_CLIENT_WS_URL=ws://localhost:8500
    restart: unless-stopped
    networks:
      - workbench-network

  # Claude 3.7 Journey Mapper - Original journey mapping tool
  journey-mapper:
    build:
      context: ./internal-solutions-journeymapper
      dockerfile: Dockerfile.enhanced
    container_name: journey-mapper
    ports:
      - "8080:8000"
    volumes:
      - ./internal-solutions-journeymapper/logs:/app/logs
      - ./internal-solutions-journeymapper/uploads:/app/uploads
      - ./internal-solutions-journeymapper/journey_maps:/app/journey_maps
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
      - PORT=8000
    restart: unless-stopped
    networks:
      - workbench-network

  # Claude 4 Journey Mapper - New journey mapping tool optimized for Claude 4
  claude4-journey-mapper:
    build:
      context: ./internal-solutions-claude4-journey-mapper
      dockerfile: Dockerfile.enhanced
    container_name: claude4-journey-mapper
    ports:
      - "8090:8000"
    volumes:
      - ./internal-solutions-claude4-journey-mapper/logs:/app/logs
      - ./internal-solutions-claude4-journey-mapper/uploads:/app/uploads
      - ./internal-solutions-claude4-journey-mapper/journey_maps:/app/journey_maps
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=anthropic.claude-sonnet-4-20250514-v1:0
      - PORT=8000
    restart: unless-stopped
    networks:
      - workbench-network

  # Journey MCP Service - Provides MCP wrapper for Claude 3.7 Journey Mapper
  journey-mcp:
    build: ./mcp-services/journey-mcp
    container_name: journey-mcp
    depends_on:
      - journey-mapper
    ports:
      - "8003:8003"
    environment:
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:8080
      - PORT=8003
    restart: unless-stopped
    networks:
      - workbench-network

  # Claude 4 Journey MCP Service - Provides MCP wrapper for Claude 4 Journey Mapper
  claude4-journey-mcp:
    build: ./internal-solutions-claude4-journey-mapper/mcp-service
    container_name: claude4-journey-mcp
    depends_on:
      - claude4-journey-mapper
    ports:
      - "8091:8003"
    environment:
      - JOURNEY_MAPPER_URL=http://claude4-journey-mapper:8000
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:8090
      - PORT=8003
    restart: unless-stopped
    networks:
      - workbench-network

  # Reddit Data Collector - Gathers Reddit data from subreddits
  reddit-ripper:
    build: ./internal-solutions-reddit-ripper
    container_name: reddit-ripper
    ports:
      - "5001:5001"
    volumes:
      - ./internal-solutions-reddit-ripper/downloads:/app/downloads
    restart: unless-stopped
    networks:
      - workbench-network

  # Reddit MCP Service - Provides MCP wrapper for Reddit Data Collector
  reddit-mcp:
    build: ./mcp-services/reddit-mcp
    container_name: reddit-mcp
    depends_on:
      - reddit-ripper
    environment:
      - REDDIT_RIPPER_URL=http://reddit-ripper:5001
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:5001
    restart: unless-stopped
    networks:
      - workbench-network

  # Video Transcriptor - Processes and analyzes video content
  video-analyzer:
    build: ./internal-solutions-video-analyzer
    container_name: video-analyzer
    ports:
      - "5002:5002"
    volumes:
      - ./internal-solutions-video-analyzer/uploads:/app/uploads
      - ./internal-solutions-video-analyzer/transcripts:/app/transcripts
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped
    networks:
      - workbench-network

  # Video MCP Service - Provides MCP wrapper for Video Transcriptor
  video-mcp:
    build: ./mcp-services/video-mcp
    container_name: video-mcp
    depends_on:
      - video-analyzer
    environment:
      - VIDEO_ANALYZER_URL=http://video-analyzer:5002
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:5002
    restart: unless-stopped
    networks:
      - workbench-network

  # Agent Service - Manages conversation context and tool invocation
  agent:
    build: ./mcp-services/agent
    container_name: agent
    ports:
      - "8500:8500"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
      - PORT=8500
    restart: unless-stopped
    networks:
      - workbench-network

networks:
  workbench-network:
    name: workbench-network