version: '3'

services:
  # Claude 4 Journey Mapper service
  claude4-journey-mapper:
    build:
      context: .
      dockerfile: Dockerfile.enhanced
    container_name: claude4-journey-mapper
    ports:
      - "8090:8000"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./journey_maps:/app/journey_maps
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-sonnet-4-20250514
      - PORT=8000
    restart: unless-stopped
    networks:
      - workbench-network

  # MCP service for Claude 4 Journey Mapper
  claude4-journey-mcp:
    build:
      context: ../mcp-services/journey-mcp
    container_name: claude4-journey-mcp
    depends_on:
      - claude4-journey-mapper
    ports:
      - "8091:8003"
    environment:
      - JOURNEY_MAPPER_URL=http://claude4-journey-mapper:8000
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:8090
      - PORT=8003
    restart: unless-stopped
    networks:
      - workbench-network

networks:
  workbench-network:
    name: workbench-network
    external: true