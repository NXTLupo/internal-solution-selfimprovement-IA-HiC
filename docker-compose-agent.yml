services:
  # Main services
  journey-mapper:
    image: journey-mapper:latest
    build:
      context: ./internal-solutions-journeymapper
    container_name: journey-mapper
    ports:
      - "8080:8000"
    volumes:
      - ./internal-solutions-journeymapper:/app
      - /tmp/journey-mcp:/tmp/journey-mcp
    env_file:
      - .env
    environment:
      - PORT=8000
    networks:
      - nxt-humans-network

  reddit-ripper:
    image: reddit-ripper:latest
    build:
      context: ./internal-solutions-reddit-ripper
    container_name: reddit-ripper
    ports:
      - "5001:5000"
    volumes:
      - ./internal-solutions-reddit-ripper:/app
    networks:
      - nxt-humans-network

  social-research-frontend:
    image: social-research-frontend:latest
    build:
      context: ./internal-solutions-socialresearch/frontend
    container_name: social-research-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./internal-solutions-socialresearch/frontend:/app
    networks:
      - nxt-humans-network

  # Video analyzer service
  video-analyzer:
    image: video-analyzer:latest
    build:
      context: ./internal-solutions-video-analyzer
    container_name: video-analyzer
    ports:
      - "5002:5000"
    volumes:
      - ./internal-solutions-video-analyzer:/app
    networks:
      - nxt-humans-network

  # Launchpad service
  launchpad:
    image: launchpad:latest
    build:
      context: ./launchpad
    container_name: launchpad
    ports:
      - "8000:8000"
    volumes:
      - ./launchpad:/app
    environment:
      - PORT=8000
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:8080
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:5001
      - SOCIAL_RESEARCH_URL=http://social-research-frontend:3000
      - SOCIAL_RESEARCH_CLIENT_URL=http://localhost:3000
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:5002
      - ENABLE_CX_AGENT=true
      - AGENT_URL=http://agent:8500
      - AGENT_WS_URL=ws://agent:8500
      - AGENT_CLIENT_URL=http://localhost:8090
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      - VIDEO_MCP_URL=http://video-mcp:8004
    networks:
      - nxt-humans-network
    depends_on:
      - journey-mapper
      - reddit-ripper
      - social-research-frontend
      - video-analyzer

  # Agent services
  agent:
    image: agent:latest
    build:
      context: ./mcp-services/agent
    container_name: agent
    ports:
      - "8090:8500"
    volumes:
      - ./mcp-services/agent:/app
      - ./mcp-services/agent/logs:/app/logs
    environment:
      - PORT=8500
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      - VIDEO_MCP_URL=http://video-mcp:8004
    networks:
      - nxt-humans-network

  reddit-mcp:
    image: reddit-mcp:latest
    build:
      context: ./mcp-services/reddit-mcp
    container_name: reddit-mcp
    volumes:
      - ./mcp-services/reddit-mcp:/app
    environment:
      - PORT=8501
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
    networks:
      - nxt-humans-network

  social-mcp:
    image: social-mcp:latest
    build:
      context: ./mcp-services/social-mcp
    container_name: social-mcp
    volumes:
      - ./mcp-services/social-mcp:/app
    environment:
      - PORT=8502
      - SOCIAL_RESEARCH_URL=http://social-research-frontend:3000
    networks:
      - nxt-humans-network

  journey-mcp:
    image: journey-mcp:latest
    build:
      context: ./mcp-services/journey-mcp
    container_name: journey-mcp
    volumes:
      - ./mcp-services/journey-mcp:/app
      - ./mcp-services/journey-mcp/uploads:/app/uploads
      - /tmp/journey-mcp:/tmp/journey-mcp
    environment:
      - PORT=8503
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
    networks:
      - nxt-humans-network

  video-mcp:
    image: video-mcp:latest
    build:
      context: ./mcp-services/video-mcp
    container_name: video-mcp
    volumes:
      - ./mcp-services/video-mcp:/app
    environment:
      - PORT=8004
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
    networks:
      - nxt-humans-network

networks:
  nxt-humans-network:
    driver: bridge