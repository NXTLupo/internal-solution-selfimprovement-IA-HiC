services:
  launchpad:
    image: python:3.9-slim
    ports:
      - "${LAUNCHPAD_PORT:-8000}:8000"
    environment:
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      - CLAUDE4_JOURNEY_MAPPER_URL=http://claude4-journey-mapper:8000
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
      - SOCIAL_RESEARCH_URL=http://social-research-frontend:3000
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
      - LINKEDIN_GENERATOR_URL=http://linkedin-generator:5000
      - MIRO_GENERATOR_URL=http://miro-generator:5004
      - IMAGE_CAPTIONER_URL=http://image-captioner:5005
      - FLUX_LORA_STUDIO_URL=http://flux-lora-studio:5006
      - PRESENTATION_GENERATOR_URL=http://presentation-generator:5007
      - SOUNDTRACK_GENERATOR_URL=http://soundtrack-generator:5009
      - CONSISTENT_CHARACTER_GENERATOR_URL=http://consistent-character-generator:5010
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:${JOURNEY_MAPPER_PORT:-8080}
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:${REDDIT_RIPPER_PORT:-5001}
      - SOCIAL_RESEARCH_CLIENT_URL=http://localhost:${SOCIAL_RESEARCH_PORT:-3000}
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:${VIDEO_ANALYZER_PORT:-5002}
      - LINKEDIN_GENERATOR_CLIENT_URL=http://localhost:${LINKEDIN_GENERATOR_PORT:-5003}
      - MIRO_GENERATOR_CLIENT_URL=http://localhost:${MIRO_GENERATOR_PORT:-5004}
      - IMAGE_CAPTIONER_CLIENT_URL=http://localhost:${IMAGE_CAPTIONER_PORT:-5005}
      - FLUX_LORA_STUDIO_CLIENT_URL=http://localhost:${FLUX_LORA_STUDIO_PORT:-5006}
      - PRESENTATION_GENERATOR_CLIENT_URL=http://localhost:${PRESENTATION_GENERATOR_PORT:-5007}
      - SOUNDTRACK_GENERATOR_CLIENT_URL=http://localhost:${SOUNDTRACK_GENERATOR_PORT:-5009}
      - COMPETITIVE_INTELLIGENCE_CLIENT_URL=http://localhost:${COMPETITIVE_INTELLIGENCE_PORT:-5010}
      - PORT=8000
      - ENABLE_CX_AGENT=true
      - AGENT_URL=http://agent:8500
      - AGENT_WS_URL=ws://agent:8500
      - AGENT_CLIENT_URL=http://localhost:${AGENT_ORCHESTRATOR_PORT:-8500}
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      - VIDEO_MCP_URL=http://video-mcp:8504
    volumes:
      - ./launchpad:/app
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt &&
              python app.py"
    networks:
      - nxt-humans-network

  # Agent Orchestrator Service
  agent:
    image: python:3.10-slim
    ports:
      - "${AGENT_ORCHESTRATOR_PORT:-8500}:8500"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=8500
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      - CLAUDE4_JOURNEY_MCP_URL=http://claude4-journey-mcp:8506
      - VIDEO_MCP_URL=http://video-mcp:8504
    volumes:
      - ./mcp-services/agent:/app
    working_dir: /app
    container_name: agent
    hostname: agent
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel &&
              pip install --no-cache-dir -r requirements.txt &&
              python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - reddit-mcp
      - social-mcp
      - journey-mcp
      - claude4-journey-mcp
      - video-mcp

  # Reddit Ripper MCP Wrapper
  reddit-mcp:
    image: python:3.9-slim
    ports:
      - "${REDDIT_MCP_PORT:-8501}:8501"
    environment:
      - PORT=8501
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
    volumes:
      - ./mcp-services/reddit-mcp:/app
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip &&
              pip install --no-cache-dir -r requirements.txt &&
              python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - reddit-ripper

  # Social Research MCP Wrapper
  social-mcp:
    image: python:3.9-slim
    ports:
      - "${SOCIAL_MCP_PORT:-8502}:8502"
    environment:
      - PORT=8502
      - SOCIAL_RESEARCH_BACKEND_URL=http://social-research-backend:8081
    volumes:
      - ./mcp-services/social-mcp:/app
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip &&
              pip install --no-cache-dir -r requirements.txt &&
              python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - social-research-backend

  # Journey Mapper MCP Wrapper
  journey-mcp:
    image: python:3.10-slim
    ports:
      - "${JOURNEY_MCP_PORT:-8503}:8503"
    environment:
      - PORT=8503
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
    volumes:
      - ./mcp-services/journey-mcp:/app
      - journey-uploads:/app/uploads
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel &&
              pip install --no-cache-dir -r requirements.txt &&
              mkdir -p uploads &&
              python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - journey-mapper

  # Claude 4 Journey Mapper MCP Wrapper
  claude4-journey-mcp:
    image: python:3.10-slim
    ports:
      - "${CLAUDE4_JOURNEY_MCP_PORT:-8506}:8506"
    environment:
      - PORT=8506
      - CLAUDE4_JOURNEY_MAPPER_URL=http://claude4-journey-mapper:8000
    volumes:
      - ./mcp-services/claude4-journey-mcp:/app
      - claude4-journey-uploads:/app/uploads
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel &&
              pip install --no-cache-dir -r requirements.txt &&
              mkdir -p uploads &&
              python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - claude4-journey-mapper

  # Video Analyzer MCP Wrapper
  video-mcp:
    image: python:3.11-slim
    ports:
      - "${VIDEO_MCP_PORT:-8504}:8504"
    environment:
      - PORT=8504
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:${VIDEO_ANALYZER_PORT:-5002}
    volumes:
      - ./mcp-services/video-mcp:/app
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel &&
              pip install --no-cache-dir -r requirements.txt &&
              uvicorn app:app --host 0.0.0.0 --port ${PORT:-8504}"
    networks:
      - nxt-humans-network
    depends_on:
      - video-analyzer


  journey-mapper:
    build:
      context: ./internal-solutions-journeymapper
      dockerfile: Dockerfile.enhanced
    ports:
      - "${JOURNEY_MAPPER_PORT:-8080}:8000"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=8000
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
    networks:
      - nxt-humans-network

  claude4-journey-mapper:
    build:
      context: ./internal-solutions-claude4-journey-mapper-v2
      dockerfile: Dockerfile.enhanced
    ports:
      - "${CLAUDE4_JOURNEY_MAPPER_PORT:-8095}:8000"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=8000
      - ANTHROPIC_MODEL=claude-sonnet-4-20250514
    networks:
      - nxt-humans-network

  reddit-ripper:
    image: python:3.9-slim
    ports:
      - "${REDDIT_RIPPER_PORT:-5001}:5000"
    environment:
      - PORT=5000
    volumes:
      - ./internal-solutions-reddit-ripper:/app
    working_dir: /app
    command: >
      bash -c "pip install -r requirements.txt &&
              python app.py"
    networks:
      - nxt-humans-network

  social-research-frontend:
    image: node:20-slim
    ports:
      - "${SOCIAL_RESEARCH_PORT:-3000}:3000"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=3000
      - VITE_API_URL=http://localhost:${SOCIAL_RESEARCH_BACKEND_PORT:-8081}
    volumes:
      - ./internal-solutions-socialresearch:/app
    working_dir: /app/frontend
    command: >
      bash -c "npm install &&
              npm run dev -- --port=3000"
    networks:
      - nxt-humans-network
    depends_on:
      - social-research-backend
    container_name: nxthumans_ai_cx_workbench-social-research-1
  
  social-research-backend:
    image: python:3.9-slim
    ports:
      - "${SOCIAL_RESEARCH_BACKEND_PORT:-8081}:8081"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - CLAUDE_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - AZURE_OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - AZURE_OPENAI_KEY=***REDACTED-OPENAI-KEY***
      - GEMINI_API_KEY=***REDACTED-GOOGLE-KEY***
      - PORT=8081
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
      - POSTGRES_SERVER=social-research-db
      - POSTGRES_HOST=social-research-db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@social-research-db:5432/app
      - FLASK_DEBUG=true
      - SKIP_AZURE_AUTH=true
      - USE_LOCAL_MODELS=true
      - MOCK_AZURE_SERVICES=true
    volumes:
      - ./internal-solutions-socialresearch:/app
    working_dir: /app/backend
    command: >
      bash -c "apt-get update && apt-get install -y build-essential libpq-dev git &&
              pip install --no-cache-dir --upgrade pip &&
              pip install --no-cache-dir -r requirements.txt &&
              python init_db.py &&
              python -m run"
    networks:
      - nxt-humans-network
    depends_on:
      - social-research-db
  
  social-research-db:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - social-research-db-data:/var/lib/postgresql/data
    networks:
      - nxt-humans-network

  video-analyzer:
    image: python:3.11-slim
    ports:
      - "${VIDEO_ANALYZER_PORT:-5002}:5000"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=5000
    volumes:
      - ./internal-solutions-video-analyzer:/app
    working_dir: /app
    command: >
      bash -c "apt-get update && apt-get install -y ffmpeg &&
              pip install --no-cache-dir -r requirements.txt &&
              python run.py"
    networks:
      - nxt-humans-network

  linkedin-generator:
    image: python:3.11-slim
    ports:
      - "${LINKEDIN_GENERATOR_PORT:-5003}:5000"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - PORT=5000
      - CLAUDE_MODEL=claude-3-7-sonnet-20250219
      - OPENAI_MODEL=gpt-4o
      - MAX_TOKENS=64000
      - TEMPERATURE=0.3
    volumes:
      - ./internal-solutions-linkedin-generator:/app
      - linkedin-generator-uploads:/app/uploads
      - linkedin-generator-generated:/app/generated_content
    working_dir: /app
    command: >
      bash -c "apt-get update && apt-get install -y build-essential &&
              pip install --no-cache-dir --upgrade pip setuptools wheel &&
              pip install --no-cache-dir -r requirements.txt &&
              python -m spacy download en_core_web_sm &&
              mkdir -p uploads generated_content static/css static/js &&
              uvicorn app:app --host 0.0.0.0 --port 5000"
    networks:
      - nxt-humans-network

  miro-generator:
    build:
      context: ./internal-solutions-miro-generator
      dockerfile: Dockerfile.simple
    ports:
      - "${MIRO_GENERATOR_PORT:-5004}:5004"
    environment:
      - MIRO_ACCESS_TOKEN=REDACTED
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=5004
      - NODE_ENV=production
      - FLASK_ENV=production
    volumes:
      - ./internal-solutions-miro-generator:/app
      - miro-generator-uploads:/app/uploads
      - miro-generator-output:/app/output
    working_dir: /app
    networks:
      - nxt-humans-network

  image-captioner:
    build:
      context: ./internal-solutions-image-captioner
      dockerfile: Dockerfile
    ports:
      - "${IMAGE_CAPTIONER_PORT:-5005}:5005"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - PORT=5005
    volumes:
      - ./internal-solutions-image-captioner:/app
      - image-captioner-uploads:/app/uploads
    working_dir: /app
    networks:
      - nxt-humans-network

  flux-lora-studio:
    build:
      context: ./internal-solutions-flux-lora-studio
      dockerfile: Dockerfile
    ports:
      - "${FLUX_LORA_STUDIO_PORT:-5006}:5006"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - PORT=5006
      - IMAGE_CAPTIONER_URL=http://image-captioner:5005
    volumes:
      - ./internal-solutions-flux-lora-studio:/app
      - flux-lora-studio-uploads:/app/uploads
      - flux-lora-studio-datasets:/app/datasets
      - flux-lora-studio-zips:/app/zips
    working_dir: /app
    networks:
      - nxt-humans-network
    depends_on:
      - image-captioner

  presentation-generator:
    build:
      context: ./internal-solutions-presentation-generator
      dockerfile: Dockerfile
    ports:
      - "${PRESENTATION_GENERATOR_PORT:-5007}:5007"
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - PORT=5007
    volumes:
      - ./internal-solutions-presentation-generator:/app
      - presentation-generator-uploads:/app/uploads
      - presentation-generator-generated:/app/generated_content
    working_dir: /app
    networks:
      - nxt-humans-network

  soundtrack-generator:
    build:
      context: ./internal-solutions-soundtrack-generator
      dockerfile: Dockerfile
    ports:
      - "${SOUNDTRACK_GENERATOR_PORT:-5009}:5009"
    environment:
      - ELEVENLABS_API_KEY=REDACTED
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - PORT=5009
      - MAX_FILE_SIZE=524288000
      - DEFAULT_VOICE_ID=EXAVITQu4vr4xnSDxMaL
    volumes:
      - ./internal-solutions-soundtrack-generator:/app
      - soundtrack-generator-uploads:/app/uploads
      - soundtrack-generator-generated:/app/generated
    working_dir: /app
    networks:
      - nxt-humans-network

  consistent-character-generator:
    build:
      context: ./internal-solutions-consistent-character-generator
      dockerfile: Dockerfile
    ports:
      - "${CONSISTENT_CHARACTER_GENERATOR_PORT:-5010}:5010"
    environment:
      - PORT=5010
      - FLASK_ENV=production
    volumes:
      - ./internal-solutions-consistent-character-generator:/app
    working_dir: /app
    networks:
      - nxt-humans-network

networks:
  nxt-humans-network:
    driver: bridge

volumes:
  social-research-db-data:
    driver: local
  journey-uploads:
    driver: local
  claude4-journey-uploads:
    driver: local
  linkedin-generator-uploads:
    driver: local
  linkedin-generator-generated:
    driver: local
  miro-generator-uploads:
    driver: local
  miro-generator-output:
    driver: local
  image-captioner-uploads:
    driver: local
  image-captioner-generated:
    driver: local
  flux-lora-studio-uploads:
    driver: local
  flux-lora-studio-datasets:
    driver: local
  flux-lora-studio-zips:
    driver: local
  presentation-generator-uploads:
    driver: local
  presentation-generator-generated:
    driver: local
  soundtrack-generator-uploads:
    driver: local
  soundtrack-generator-generated:
    driver: local
  consistent-character-generator-data:
    driver: local
