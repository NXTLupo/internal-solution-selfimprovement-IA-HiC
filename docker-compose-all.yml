services:
  launchpad:
    image: python:3.9-slim
    ports:
      - "${LAUNCHPAD_PORT:-8000}:8000"
    environment:
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      # Removed CLAUDE4_JOURNEY_MAPPER_URL
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
      - SOCIAL_RESEARCH_URL=http://social-research-frontend:3000
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
      - MIRO_GENERATOR_URL=http://miro-generator:5004
      - CONSISTENT_CHARACTER_GENERATOR_URL=http://consistent-character-generator:5010
      - COPILOT_RECIPE_GENERATOR_URL=http://copilot-recipe-generator:5013
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:${JOURNEY_MAPPER_PORT:-8080}
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:${REDDIT_RIPPER_PORT:-5001}
      - SOCIAL_RESEARCH_CLIENT_URL=http://localhost:${SOCIAL_RESEARCH_PORT:-3000}
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:${VIDEO_ANALYZER_PORT:-5002}
      - MIRO_GENERATOR_CLIENT_URL=http://localhost:${MIRO_GENERATOR_PORT:-5004}
      - COPILOT_RECIPE_GENERATOR_CLIENT_URL=http://localhost:${COPILOT_RECIPE_GENERATOR_PORT:-5013}
      - PORT=8000
      - ENABLE_CX_AGENT=true
      - AGENT_URL=http://nxt-agency-backend:8000
      - AGENT_WS_URL=ws://nxt-agency-backend:8000
      - AGENT_CLIENT_URL=http://localhost:${NXT_AGENCY_BACKEND_PORT:-8201}
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      - VIDEO_MCP_URL=http://video-mcp:8504
    volumes:
      - ./launchpad:/app
    working_dir: /app
    command: >-
      bash -c "pip install -r requirements.txt && python app.py"
    networks:
      - nxt-humans-network

  # Agent Orchestrator Service
  agent:
    image: python:3.10-slim
    ports:
      - "${AGENT_ORCHESTRATOR_PORT:-8500}:8500"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=8500
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
      - REDDIT_MCP_URL=http://reddit-mcp:8501
      - SOCIAL_MCP_URL=http://social-mcp:8502
      - JOURNEY_MCP_URL=http://journey-mcp:8503
      # Claude 4 Journey Mapper removed
      - VIDEO_MCP_URL=http://video-mcp:8504
      - RESEARCH_MCP_URL=http://research-mcp:8507
    volumes:
      - ./mcp-services/agent:/app
    working_dir: /app
    container_name: agent
    hostname: agent
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt && python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - reddit-mcp
      - social-mcp
      - journey-mcp
      - video-mcp
      - research-mcp

  # Reddit Ripper MCP Wrapper
  reddit-mcp:
    image: python:3.9-slim
    ports:
      - "${REDDIT_MCP_PORT:-8501}:8501"
    environment:
      - PORT=8501
      - REDDIT_RIPPER_URL=http://reddit-ripper:5000
    volumes:
      - ./mcp-services/reddit-mcp:/app
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt && python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - reddit-ripper

  # Social Research MCP Wrapper
  social-mcp:
    image: python:3.9-slim
    ports:
      - "${SOCIAL_MCP_PORT:-8502}:8502"
    environment:
      - PORT=8502
      - SOCIAL_RESEARCH_BACKEND_URL=http://social-research-backend:8081
    volumes:
      - ./mcp-services/social-mcp:/app
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -r requirements.txt && python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - social-research-backend

  # Journey Mapper MCP Wrapper
  journey-mcp:
    image: python:3.10-slim
    ports:
      - "${JOURNEY_MCP_PORT:-8503}:8503"
    environment:
      - PORT=8503
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
    volumes:
      - ./mcp-services/journey-mcp:/app
      - journey-uploads:/app/uploads
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt && mkdir -p uploads && python app.py"
    networks:
      - nxt-humans-network
    depends_on:
      - journey-mapper

  # Claude 4 Journey Mapper MCP Wrapper removed

  # Research Generator MCP Wrapper
  research-mcp:
    image: python:3.10-slim
    ports:
      - "${RESEARCH_MCP_PORT:-8507}:8507"
    environment:
      - PORT=8507
      - RESEARCH_GENERATOR_URL=http://research-generator:5011
      - RESEARCH_GENERATOR_CLIENT_URL=http://localhost:${RESEARCH_GENERATOR_PORT:-5011}
    volumes:
      - ./mcp-services/research-mcp:/app
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 8507"
    networks:
      - nxt-humans-network
    depends_on:
      - research-generator

  # Video Analyzer MCP Wrapper
  video-mcp:
    image: python:3.11-slim
    ports:
      - "${VIDEO_MCP_PORT:-8504}:8504"
    environment:
      - PORT=8504
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VIDEO_ANALYZER_URL=http://video-analyzer:5000
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:${VIDEO_ANALYZER_PORT:-5002}
    volumes:
      - ./mcp-services/video-mcp:/app
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port ${PORT:-8504}"
    networks:
      - nxt-humans-network
    depends_on:
      - video-analyzer

  journey-mapper:
    build:
      context: ./internal-solutions-journeymapper
      dockerfile: Dockerfile.enhanced
    ports:
      - "${JOURNEY_MAPPER_PORT:-8080}:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=8000
      # 2026-06-03 — standalone Journey Mapper upgraded to Opus 4.8 (1M context).
      # Opus 4.8 rejects sampling params; claude_api_wrapper strips temperature
      # for opus-4-8 (see _model_deprecates_temperature) so calls don't 400.
      - ANTHROPIC_MODEL=claude-opus-4-8
    volumes:
      - ./internal-solutions-journeymapper/static:/app/static
      - ./internal-solutions-journeymapper/journey_maps:/app/journey_maps
    networks:
      - nxt-humans-network

  # claude4-journey-mapper service removed

  reddit-ripper:
    image: python:3.9-slim
    ports:
      - "${REDDIT_RIPPER_PORT:-5001}:5000"
    environment:
      - PORT=5000
    volumes:
      - ./internal-solutions-reddit-ripper:/app
    working_dir: /app
    command: >-
      bash -c "pip install -r requirements.txt && python app_unified.py"
    networks:
      - nxt-humans-network

  social-research-frontend:
    build:
      context: ./internal-solutions-socialresearch/frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${SOCIAL_RESEARCH_PORT:-3000}:5173"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VITE_API_BASE_URL=http://localhost:${SOCIAL_RESEARCH_BACKEND_PORT:-8081}
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
    volumes:
      - ./internal-solutions-socialresearch/frontend:/app/frontend
      - /app/frontend/node_modules  # Anonymous volume to prevent host node_modules from overriding container's
    working_dir: /app/frontend
    networks:
      - nxt-humans-network
    depends_on:
      - social-research-backend
    container_name: social-research-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  social-research-backend:
    build:
      context: ./internal-solutions-socialresearch/backend
      dockerfile: Dockerfile
    ports:
      - "${SOCIAL_RESEARCH_BACKEND_PORT:-8081}:8081"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_API_KEY=${ANTHROPIC_API_KEY}
      # Removed CLAUDE4_API_KEY
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHATGPT5_API_KEY=${CHATGPT5_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT}
      - REDDIT_REDIRECT_URI=${REDDIT_REDIRECT_URI}
      - AZURE_DEEPSEEK_KEY=${AZURE_DEEPSEEK_KEY}
      - PORT=8081
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
      - POSTGRES_SERVER=social-research-db
      - POSTGRES_HOST=social-research-db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql://postgres:postgres@social-research-db:5432/app
      - FLASK_DEBUG=true
    volumes:
      - ./internal-solutions-socialresearch/backend:/app
    # Use the image's default WORKDIR and CMD (startup.py + gunicorn)
    # working_dir and command intentionally omitted to rely on Dockerfile
    networks:
      - nxt-humans-network
    depends_on:
      social-research-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8081)); s.close(); sys.exit(0)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

  social-research-db:
    image: ankane/pgvector:v0.5.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=app
    volumes:
      - social-research-db-data:/var/lib/postgresql/data
    networks:
      - nxt-humans-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  video-analyzer:
    image: python:3.11-slim
    ports:
      - "${VIDEO_ANALYZER_PORT:-5002}:5000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - USE_WHISPER_API=true
      - PORT=5000
    volumes:
      - ./internal-solutions-video-analyzer:/app
      - ./launchpad/static:/app/static/launchpad:ro
    working_dir: /app
    command: >-
      bash -c "apt-get update && apt-get install -y ffmpeg && pip install --no-cache-dir -r requirements.txt && python run.py"
    networks:
      - nxt-humans-network

  miro-generator:
    build:
      context: ./internal-solutions-miro-generator
      dockerfile: Dockerfile.simple
    ports:
      - "${MIRO_GENERATOR_PORT:-5004}:5004"
    environment:
      - MIRO_ACCESS_TOKEN=${MIRO_ACCESS_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=5004
      - NODE_ENV=production
      - FLASK_ENV=production
    volumes:
      - ./internal-solutions-miro-generator:/app
      - miro-generator-uploads:/app/uploads
      - miro-generator-output:/app/output
    working_dir: /app
    networks:
      - nxt-humans-network

  # Consistent Character Generator Service
  consistent-character-generator:
    build:
      context: ./internal-solutions-consistent-character-generator
      dockerfile: Dockerfile
    ports:
      - "${CONSISTENT_CHARACTER_GENERATOR_PORT:-5010}:5010"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - PORT=5010
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./internal-solutions-consistent-character-generator:/app
      - consistent-character-generator-data:/app/uploads
    working_dir: /app
    networks:
      - nxt-humans-network

  # Copilot Studio Recipe Generator
  copilot-recipe-generator:
    image: python:3.11-slim
    ports:
      - "${COPILOT_RECIPE_GENERATOR_PORT:-5013}:5013"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PORT=5013
    volumes:
      - ./internal-solutions-copilot-recipe-generator:/app
    working_dir: /app
    command: >-
      bash -c "pip install --no-cache-dir -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 5013"
    networks:
      - nxt-humans-network

  # Humans-in-Control Research (React SPA with Gemini AI)
  research-generator:
    build:
      context: ./humans-in-control-research
      dockerfile: Dockerfile
      args:
        - GEMINI_API_KEY=${GEMINI_API_KEY}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "${RESEARCH_GENERATOR_PORT:-5011}:5011"
    environment:
      - NODE_ENV=production
    volumes:
      # 2026-04-21 — hot-reload for skill .md files. nginx serves /skills/
      # from this volume mount; editing a SKILL.md or references/*.md in
      # .claude/skills/ on the host is picked up by the next chat request
      # without an image rebuild. (Code changes to web.tsx/services/*.ts
      # still require `docker compose up -d --build research-generator`.)
      - ./.claude/skills:/usr/share/nginx/html/skills:ro
      # hic-workspace (wiki + manifest JSONs) also live-reloads so manifest
      # edits take effect without rebuild.
      - ./humans-in-control-research/hic-workspace:/usr/share/nginx/html/hic-workspace:ro
    networks:
      - nxt-humans-network
    container_name: hic-research
    depends_on:
      - research-proxy

  # Research Data Proxy (solves CORS for external data APIs)
  # 2026-05-19 — Migrated from `image: python:3.11-slim + bash pip-install
  # wrapper` to a dedicated cached-deps Dockerfile. The previous pattern
  # reinstalled 50+ Python packages from PyPI on every container start,
  # producing a 60-120 sec window where the container reported `Up` but
  # uvicorn hadn't bound port 5012 yet — every browser request during that
  # window returned ERR_EMPTY_RESPONSE. The Dockerfile bakes the deps
  # into a Docker layer that's cached across rebuilds; only requirements.txt
  # changes invalidate the layer. ffmpeg is also baked in (was apt-installed
  # on every start by the old wrapper).
  #
  # The runtime volume mount of ./humans-in-control-research/proxy:/app
  # is preserved so app.py / pptx_export.py / etc. are still hot-editable
  # on the host without a rebuild. Dependencies live in
  # /usr/local/lib/python3.11/site-packages where they survive the /app overlay.
  research-proxy:
    build: ./humans-in-control-research/proxy
    ports:
      # 2026-05-20 — Explicit IPv4 bind (127.0.0.1) to work around Docker
      # Desktop on Windows advertising [::]:5012 but not actually forwarding
      # IPv6 traffic to the container. Chrome on Windows resolves `localhost`
      # to ::1 first; without this explicit IPv4 bind, every browser request
      # connected then hung silently. With this, IPv6 fails fast (port not
      # bound on ::1) and Chrome's Happy-Eyeballs falls back to 127.0.0.1
      # which works in <100ms. Use 0.0.0.0:PORT:PORT if you need access from
      # other machines on the LAN.
      - "127.0.0.1:${RESEARCH_PROXY_PORT:-5012}:5012"
    environment:
      - PORT=5012
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # 2026-05-25 — Journey Mapper IA service URL (internal Docker network).
      # HiC #journey requests proxy through to JM's /api/analyze and return
      # the rendered HTML directly to the Design Desk. Matches the pattern
      # already used for topic-modeling re-leverage of Social Analytics.
      - JOURNEY_MAPPER_URL=http://journey-mapper:8000
      # 2026-05-05 — Azure DeepSeek-V4-Flash key. Proxy reads either name.
      - DEEPSEEK_AZURE=${DEEPSEEK_AZURE:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AZURE_DEEPSEEK_KEY=${AZURE_DEEPSEEK_KEY:-}
      - EVERY_ORG_API_KEY=${EVERY_ORG_API_KEY:-}
      # 2026-05-10 (HiC-Reddit-Deep) — PRAW credentials for the deep Reddit
      # fetcher at /api/reddit-deep/fetch. Same keys as social-research-backend
      # uses; both services share read-only OAuth access to api.reddit.com.
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID:-}
      - REDDIT_CLIENT_SECRET=${REDDIT_CLIENT_SECRET:-}
      - REDDIT_USER_AGENT=${REDDIT_USER_AGENT:-script:HiC-Research:1.0}
      # 2026-05-19 — Embedding provider. Gemini text-embedding-004 is the
      # default because OpenAI's text-embedding-3-small key on this account
      # hit `insufficient_quota`. Override to `openai` once billing is
      # restored if you want to switch back. Other valid values:
      # `openai-large` (text-embedding-3-large, 3072 dims) or `voyage`
      # (voyage-3, 1024 dims, requires VOYAGE_API_KEY).
      # 2026-06-03 — default local (quota-free sentence-transformer on the
      # social-research-backend) so retrieval never starves on Gemini 429s.
      # Override to gemini/openai/voyage via the EMBED_PROVIDER env if desired.
      - EMBED_PROVIDER=${EMBED_PROVIDER:-local}
    volumes:
      - ./humans-in-control-research/proxy:/app
      # S8: mount full hic-workspace so the scheduler can read youtube-channels.json
      # + institution-manifest.json AND write scheduler-state.json. Previously
      # only wiki/ was exposed; the wiki path stays reachable at /hic-workspace/wiki.
      - ./humans-in-control-research/hic-workspace:/hic-workspace
      # 2026-05-22 — self-improvement loop, Phase 3. Skills are mounted RW
      # so the learningEngine can patch SKILL.md files in response to feedback
      # clusters. Versioned archives go under each skill's _versions/ subdir.
      - ./.claude/skills:/skills
    working_dir: /app
    networks:
      - nxt-humans-network
    container_name: research-proxy

  # Presentation Renderer (data-driven scrolling-presentation web app)
  # Reads PresentationPayload JSON from research-proxy, renders parallax
  # scrolling experience with brand-resolved tokens (#NXT or #NU).
  # Triggered by #presentation directive in HiC AI Analyst Chat.
  presentation-renderer:
    build:
      context: ./internal-solutions-presentation-renderer
      dockerfile: Dockerfile
    ports:
      - "${PRESENTATION_RENDERER_PORT:-5014}:4500"
    environment:
      - PROXY_URL=http://research-proxy:5012
    networks:
      - nxt-humans-network
    container_name: presentation-renderer
    depends_on:
      - research-proxy

  # ============================================
  # NXT Agency - AI Agent Catalog + Backend
  # ============================================

  nxt-agency-launchpad:
    image: nginx:alpine
    container_name: nxt-agency-launchpad
    ports:
      - "${NXT_AGENCY_PORT:-5050}:80"
    volumes:
      - ./NXT-Agency/agency-agents-launchpad/dist:/usr/share/nginx/html:ro
    networks:
      - nxt-humans-network
    depends_on:
      - nxt-agency-backend

  nxt-agency-db:
    image: postgres:15-alpine
    container_name: nxt-agency-db
    environment:
      - POSTGRES_DB=ai_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - nxt-agency-db-data:/var/lib/postgresql/data
    networks:
      - nxt-humans-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nxt-agency-backend:
    build:
      context: ./NXT-Agency
      dockerfile: docker/Dockerfile.backend
    container_name: nxt-agency-backend
    ports:
      - "${NXT_AGENCY_BACKEND_PORT:-8201}:8000"
      - "${NXT_AGENCY_NOVNC_PORT:-6080}:6080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@nxt-agency-db:5432/ai_assistant
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - FIGMA_API_TOKEN=${FIGMA_API_TOKEN:-}
      - AGENT_PROMPTS_DIR=/app/agent-prompts
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      # CX Workbench MCP service URLs (for CX tools integration)
      - JOURNEY_MCP_URL=http://journey-mcp:8503/mcp
      - REDDIT_MCP_URL=http://reddit-mcp:8501/mcp
      - SOCIAL_MCP_URL=http://social-mcp:8502/mcp
      - VIDEO_MCP_URL=http://video-mcp:8504/mcp
      - JOURNEY_MAPPER_CLIENT_URL=http://localhost:${JOURNEY_MAPPER_PORT:-8080}
      - REDDIT_RIPPER_CLIENT_URL=http://localhost:${REDDIT_RIPPER_PORT:-5001}
      - VIDEO_ANALYZER_CLIENT_URL=http://localhost:${VIDEO_ANALYZER_PORT:-5002}
      - COPILOT_RECIPE_GENERATOR_CLIENT_URL=http://localhost:${COPILOT_RECIPE_GENERATOR_PORT:-5013}
      - CONSISTENT_CHARACTER_GENERATOR_CLIENT_URL=http://localhost:${CONSISTENT_CHARACTER_GENERATOR_PORT:-5010}
    volumes:
      - ./NXT-Agency/agent-prompts:/app/agent-prompts:ro
      - ./NXT-Agency/backend/app:/app/app
    networks:
      - nxt-humans-network
    depends_on:
      nxt-agency-db:
        condition: service_healthy

networks:
  nxt-humans-network:
    driver: bridge

volumes:
  social-research-db-data:
    driver: local
  journey-uploads:
    driver: local
  # claude4-journey-uploads removed
  miro-generator-uploads:
    driver: local
  miro-generator-output:
    driver: local
  consistent-character-generator-data:
    driver: local
  nxt-agency-db-data:
    driver: local
