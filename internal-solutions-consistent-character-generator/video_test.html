<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Generation Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .test-button {
            background: #00ff00;
            color: #000000;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 20px 0;
        }
        .test-button:hover {
            background: #00dd00;
        }
        .log {
            background: #000000;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
        }
        .success {
            color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
        .info {
            color: #00aaff;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.1.1/",
        "react": "https://aistudiocdn.com/react@^19.1.1",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.18.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/"
      }
    }
    </script>
    <script>
        window.API_KEY = "***REDACTED-GOOGLE-KEY***";
        window.process = {env: {API_KEY: "***REDACTED-GOOGLE-KEY***"}};
    </script>
</head>
<body>
    <h1>🎬 Consistent Persona Generator - Video Test</h1>
    <p>This page will test the Veo 3 video generation API integration.</p>

    <button class="test-button" onclick="startVideoTest()">🚀 GENERATE TEST VIDEO</button>

    <div id="log" class="log"></div>
    <div id="video-container"></div>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        window.log = function(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            logDiv.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        };

        window.startVideoTest = async function() {
            window.log('🎬 Starting video generation test...', 'info');

            // Test API key
            if (window.API_KEY) {
                window.log(`✅ API Key found: ${window.API_KEY.substring(0, 10)}...`, 'success');
            } else {
                window.log('❌ API Key not found', 'error');
                return;
            }

            try {
                const ai = new GoogleGenAI({ apiKey: window.API_KEY });
                window.log('✅ GoogleGenAI initialized', 'success');

                const prompt = "Create a cinematic 8-second video of a peaceful forest scene with gentle wind moving through the trees, golden sunlight filtering through leaves, and a sense of calm tranquility.";
                window.log(`📝 Prompt: ${prompt}`, 'info');

                window.log('🔄 Sending request to Veo 3...', 'info');

                // Use direct REST API for Veo 3 video generation
                const requestBody = {
                    prompt: prompt,
                    config: {
                        aspectRatio: "16:9",
                        resolution: "1080p"
                    }
                };

                window.log('🌐 Using direct REST API for Veo 3', 'info');

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/veo-3.0-generate-001:generateVideo?key=${window.API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error ${response.status}: ${JSON.stringify(errorData)}`);
                }

                const responseData = await response.json();

                window.log('📊 Response received from API', 'success');

                // Check for operation ID in response
                const candidates = response.candidates;
                if (candidates && candidates.length > 0) {
                    const textPart = candidates[0]?.content?.parts?.find(part => part.text);
                    if (textPart?.text) {
                        window.log(`📄 Response text: ${textPart.text}`, 'info');

                        const operationMatch = textPart.text.match(/operations\/([a-zA-Z0-9-_]+)/);
                        const operationId = operationMatch ? operationMatch[1] : null;

                        if (operationId) {
                            window.log(`🆔 Operation ID found: ${operationId}`, 'success');
                            window.log('✅ VIDEO GENERATION STARTED SUCCESSFULLY!', 'success');

                            // Start polling
                            pollOperation(operationId);
                        } else {
                            window.log('❌ No operation ID found in response', 'error');
                            window.log(`Full response: ${JSON.stringify(response, null, 2)}`, 'info');
                        }
                    }
                } else {
                    window.log('❌ No candidates found in response', 'error');
                    window.log(`Full response: ${JSON.stringify(response, null, 2)}`, 'info');
                }

            } catch (error) {
                window.log(`❌ Video generation error: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        };

        async function pollOperation(operationId) {
            window.log(`🔄 Starting to poll operation: ${operationId}`, 'info');

            const maxAttempts = 120; // 10 minutes
            let attempts = 0;
            const startTime = Date.now();

            const pollInterval = setInterval(async () => {
                attempts++;
                const elapsed = ((Date.now() - startTime) / 1000 / 60).toFixed(1);
                window.log(`🔄 Polling attempt ${attempts}/${maxAttempts} (${elapsed} min elapsed)`, 'info');

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/operations/${operationId}?key=${window.API_KEY}`);

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const operationData = await response.json();
                    window.log(`📊 Operation status - Done: ${operationData.done}, Error: ${!!operationData.error}`, 'info');

                    if (operationData.done) {
                        clearInterval(pollInterval);
                        const totalTime = ((Date.now() - startTime) / 1000 / 60).toFixed(1);

                        if (operationData.error) {
                            window.log(`❌ Video generation failed after ${totalTime} min: ${operationData.error.message}`, 'error');
                        } else {
                            window.log(`🎉 VIDEO GENERATION COMPLETED in ${totalTime} minutes!`, 'success');

                            // Extract video data
                            const candidates = operationData.response?.candidates;
                            if (candidates && candidates.length > 0) {
                                const videoData = candidates[0]?.content?.parts?.find(part => part.videoData);

                                if (videoData?.videoData) {
                                    window.log('🎥 VIDEO DATA FOUND:', 'success');
                                    window.log(`   File URI: ${videoData.videoData.fileUri}`, 'info');
                                    window.log(`   URL: ${videoData.videoData.url}`, 'info');
                                    window.log(`   MIME Type: ${videoData.videoData.mimeType}`, 'info');

                                    // Display the video
                                    if (videoData.videoData.url) {
                                        displayVideo(videoData.videoData.url);
                                    }
                                } else {
                                    window.log('❌ No video data found in completed operation', 'error');
                                    window.log(`Full response: ${JSON.stringify(operationData, null, 2)}`, 'info');
                                }
                            }
                        }
                    } else {
                        window.log('⏳ Still generating...', 'info');
                    }

                } catch (error) {
                    window.log(`❌ Polling error: ${error.message}`, 'error');

                    if (attempts >= maxAttempts) {
                        clearInterval(pollInterval);
                        window.log('⏰ Polling timeout reached', 'error');
                    }
                }

                if (attempts >= maxAttempts) {
                    clearInterval(pollInterval);
                    window.log('⏰ Maximum polling attempts reached', 'error');
                }

            }, 5000); // Poll every 5 seconds
        }

        function displayVideo(videoUrl) {
            window.log('🎥 CREATING VIDEO ELEMENT WITH URL:', 'success');
            window.log(`🔗 VIDEO URL: ${videoUrl}`, 'success');

            const container = document.getElementById('video-container');
            container.innerHTML = `
                <h2 style="color: #00ff00;">✅ VIDEO GENERATED SUCCESSFULLY!</h2>
                <p style="color: #00aaff;">Video URL: <a href="${videoUrl}" target="_blank" style="color: #00ff00;">${videoUrl}</a></p>
                <video controls style="width: 100%; max-width: 800px; border: 2px solid #00ff00; margin: 20px 0;">
                    <source src="${videoUrl}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div style="margin-top: 20px;">
                    <a href="${videoUrl}" target="_blank" style="background: #00ff00; color: #000; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">🔗 OPEN VIDEO IN NEW TAB</a>
                </div>
            `;

            window.log('✅ VIDEO ELEMENT ADDED TO PAGE!', 'success');
        }

        // Auto-start test after page load
        window.addEventListener('load', () => {
            window.log('✅ Page loaded, ready for video generation test', 'success');
        });
    </script>
</body>
</html>
