<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fluxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01C4C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A5A9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E2A38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121B26;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#backgroundGradient)" stroke="url(#fluxGradient)" stroke-width="2"/>
  
  <!-- FLUX symbol - stylized neural network nodes and connections -->
  <g fill="url(#fluxGradient)">
    <!-- Core nodes -->
    <circle cx="8" cy="12" r="2"/>
    <circle cx="16" cy="8" r="2.5"/>
    <circle cx="24" cy="12" r="2"/>
    <circle cx="12" cy="20" r="2"/>
    <circle cx="20" cy="20" r="2"/>
    
    <!-- Connection lines -->
    <g stroke="url(#fluxGradient)" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="8" y1="12" x2="16" y2="8"/>
      <line x1="16" y1="8" x2="24" y2="12"/>
      <line x1="8" y1="12" x2="12" y2="20"/>
      <line x1="24" y1="12" x2="20" y2="20"/>
      <line x1="12" y1="20" x2="20" y2="20"/>
      <line x1="16" y1="8" x2="12" y2="20"/>
      <line x1="16" y1="8" x2="20" y2="20"/>
    </g>
    
    <!-- Central FLUX indicator -->
    <circle cx="16" cy="16" r="1.5" fill="#FFFFFF" opacity="0.9"/>
  </g>
  
  <!-- Pulse animation effect -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="url(#fluxGradient)" stroke-width="0.5" opacity="0.3">
    <animate attributeName="r" values="12;14;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>