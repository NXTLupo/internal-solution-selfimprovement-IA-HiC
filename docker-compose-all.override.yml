services:
  video-analyzer:
    environment:
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - USE_WHISPER_API=true
    volumes:
      - ./internal-solutions-video-analyzer/static:/app/static

  social-research-backend:
    environment:
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - AZURE_OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - AZURE_OPENAI_KEY=***REDACTED-OPENAI-KEY***

  journey-mapper:
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219

  openai-journey-mapper:
    environment:
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***
      - OPENAI_MODEL=o3
      - REASONING_EFFORT=medium

  openai-journey-mcp:
    environment:
      - OPENAI_API_KEY=***REDACTED-OPENAI-KEY***

  agent:
    environment:
      - ANTHROPIC_API_KEY=***REDACTED-ANTHROPIC-KEY***
      - ANTHROPIC_MODEL=claude-3-7-sonnet-20250219
