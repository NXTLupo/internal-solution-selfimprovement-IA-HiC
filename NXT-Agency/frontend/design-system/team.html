<style>
  :root {
    --nxt-teal: #115054;
    --nxt-lime: #caca20;
    --nxt-darkest: #141414;
    --nxt-dark: #242424;
    --nxt-med: #3a3a3a;
    --nxt-gray: #525252;
    --nxt-label: #acacac;
    --nxt-light: #eaeaea;
    --nxt-lightest: #fafafa;
    --nxt-white: #ffffff;
    --nxt-purple: #5a07bf;
    --font-primary: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-primary);
    background: var(--nxt-darkest);
    color: var(--nxt-white);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Section ── */
  .team-section {
    width: 100%;
    min-height: 100vh;
    background: var(--nxt-dark);
    padding: 120px 40px 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Title ── */
  .team-title {
    font-family: Impact, 'Arial Black', 'Archivo', sans-serif;
    font-size: 100px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--nxt-white);
    margin-bottom: 72px;
    line-height: 1;
    text-align: center;
    user-select: none;
  }

  /* ── Team List ── */
  .team-list {
    width: 100%;
    max-width: 920px;
    list-style: none;
  }

  /* ── Row ── */
  .team-row {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
    padding: 0 20px;
    border-bottom: 1px solid var(--nxt-med);
    border-left: 3px solid transparent;
    transition: background 150ms ease, border-color 150ms ease;
    cursor: default;
  }

  .team-row:first-child {
    border-top: 1px solid var(--nxt-med);
  }

  .team-row:hover {
    background: rgba(255, 255, 255, 0.03);
    border-left-color: var(--nxt-purple);
  }

  /* ── Name + Title area ── */
  .team-info {
    display: flex;
    align-items: center;
    gap: 248px;
    flex: 1;
    min-width: 0;
  }

  .team-name {
    font-weight: 500;
    font-size: 18px;
    line-height: 1;
    color: var(--nxt-white);
    white-space: nowrap;
    transition: color 150ms ease;
  }

  .team-row:hover .team-name {
    color: var(--nxt-lime);
  }

  .team-title-role {
    font-weight: 300;
    font-size: 18px;
    line-height: 1;
    color: var(--nxt-label);
    white-space: nowrap;
  }

  /* ── LinkedIn Icon ── */
  .team-linkedin {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--nxt-gray);
    flex-shrink: 0;
    margin-left: 32px;
    transition: background 150ms ease, border-color 150ms ease;
    text-decoration: none;
  }

  .team-linkedin:hover {
    background: var(--nxt-white);
    border-color: var(--nxt-white);
  }

  .team-linkedin svg {
    width: 18px;
    height: 18px;
    fill: var(--nxt-white);
    transition: fill 150ms ease;
  }

  .team-linkedin:hover svg {
    fill: var(--nxt-dark);
  }

  /* ── Responsive ── */
  @media (max-width: 860px) {
    .team-title {
      font-size: 60px;
      margin-bottom: 48px;
    }

    .team-info {
      gap: 40px;
    }

    .team-section {
      padding: 80px 24px 100px;
    }
  }

  @media (max-width: 560px) {
    .team-title {
      font-size: 40px;
      margin-bottom: 36px;
    }

    .team-info {
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .team-row {
      height: auto;
      padding: 16px 16px;
    }

    .team-name {
      font-size: 16px;
    }

    .team-title-role {
      font-size: 14px;
    }

    .team-linkedin {
      margin-left: 20px;
    }
  }
</style>
