events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # File upload limits for large PDFs and videos
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 300s;
    
    # SSL Configuration - Using mkcert trusted certificates
    ssl_certificate /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Launchpad HTTPS
    server {
        listen 8443 ssl;
        server_name _;
        
        location / {
            proxy_pass http://launchpad:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # WebSocket support for agent
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }
    
    # Journey Mapper HTTPS
    server {
        listen 8444 ssl;
        server_name _;
        
        location / {
            proxy_pass http://journey-mapper:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 1800s;  # 30 minutes for long AI operations
            send_timeout 300s;
        }
    }
    
    # OpenAI Journey Mapper HTTPS
