<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="a11y-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#01C4C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#a11y-grad)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Accessibility symbol (wheelchair icon) -->
  <g fill="#ffffff">
    <!-- Head -->
    <circle cx="45" cy="25" r="6"/>
    
    <!-- Body/Arms -->
    <path d="M35 35 Q40 32 45 35 L48 45 Q50 47 52 45 L58 40 Q60 38 62 40 Q60 42 58 44 L52 49 Q48 51 45 49 L42 39 Q38 37 35 39 Q33 37 35 35 Z"/>
    
    <!-- Wheelchair wheel -->
    <circle cx="42" cy="65" r="15" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="42" cy="65" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Wheelchair seat -->
    <path d="M35 50 Q40 48 45 50 L48 58 Q46 62 42 62 Q38 62 35 58 Z"/>
    
    <!-- Small front wheel -->
    <circle cx="60" cy="72" r="4" fill="#ffffff"/>
    
    <!-- Connection to front wheel -->
    <path d="M52 62 L56 68" stroke="#ffffff" stroke-width="2" fill="none"/>
  </g>
  
  <!-- A11y text elements -->
  <text x="75" y="25" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff">A11y</text>
  
  <!-- AI sparkles -->
  <path d="M20 20 L21 16 L22 20 L26 21 L22 22 L21 26 L20 22 L16 21 Z" fill="#ffffff"/>
  <path d="M80 80 L81 77 L82 80 L85 81 L82 82 L81 85 L80 82 L77 81 Z" fill="#ffffff"/>
</svg>