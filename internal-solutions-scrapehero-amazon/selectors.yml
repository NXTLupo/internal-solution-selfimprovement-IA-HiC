product_title: 
    css: '#productTitle, .product-title'
    xpath: null
    type: Text
number_of_reviews: 
    css: '#acrCustomerReviewText, .totalReviewCount'
    xpath: null
    type: Text
average_rating: 
    css: '#averageCustomerReviews .a-icon-alt, .averageCustomerRating'
    xpath: null
    type: Text
reviews:
    css: '[data-hook="review"], #cm_cr-review_list > div.review'
    xpath: null
    multiple: true
    type: Container
    children:
        author: 
            css: '.a-profile-name'
            xpath: null
            type: Text
        rating: 
            css: 'i[data-hook="review-star-rating"], i[data-hook="cmps-review-star-rating"], .review-rating > span'
            xpath: null
            type: Text
        title: 
            css: '[data-hook="review-title"] > span, .review-title > span'
            xpath: null
            type: Text
        content: 
            css: '[data-hook="review-body"] > span, .review-text-content > span'
            xpath: null
            type: Text
        date: 
            css: '[data-hook="review-date"], .review-date'
            xpath: null
            type: Text
        variant: 
            css: '.review-data.a-color-secondary, [data-hook="format-strip"]'
            xpath: null
            type: Text
        verified_purchase: 
            css: '[data-hook="avp-badge"], .a-declarative > a[data-hook="review-verified-purchase"]'
            xpath: null
            type: Text
        image_urls:
            css: '[data-hook="review-image-tile"] img, .review-image-tile-section img'
            xpath: null
            multiple: true
            type: Attribute
            attribute: src
        helpful_votes: 
            css: '[data-hook="helpful-vote-statement"], .cr-vote-text'
            xpath: null
            type: Text
rating_histogram:
    css: '.a-histogram-row .a-meter, #histogramTable .a-meter > .a-meter-bar'
    xpath: null
    multiple: true
    type: Text