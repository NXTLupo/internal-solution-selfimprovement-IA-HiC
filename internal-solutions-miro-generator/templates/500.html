<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | NXT Miro Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Archivo', 'Inter', sans-serif;
            background: #ffffff;
            color: #141414;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .error-container {
            max-width: 600px;
            background: #fafafa;
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #e5e5e5;
        }
        h1 {
            font-size: 72px;
            margin: 0 0 16px 0;
            font-weight: 200;
            color: #FF5A5A;
        }
        h2 {
            font-size: 21px;
            margin: 0 0 24px 0;
            font-weight: 500;
            color: #141414;
        }
        p {
            font-size: 16px;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 24px;
            color: #525252;
        }
        .btn {
            display: inline-block;
            padding: 16px 24px;
            background: #caca20;
            color: #115054;
            text-decoration: none;
            border-radius: 2px;
            transition: all 150ms ease;
            font-family: 'Archivo', sans-serif;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            height: 48px;
            margin: 0 8px;
        }
        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. We're working to fix this issue.</p>
        <p>Please try again in a few moments or contact support if the problem persists.</p>
        <a href="/" class="btn">Try Again</a>
        <a href="/health" class="btn">Service Status</a>
    </div>
</body>
</html>
