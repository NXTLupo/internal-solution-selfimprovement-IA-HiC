version: '3'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pre-pull the Gemma model
    command: >
      sh -c "ollama serve & sleep 10 && ollama pull gemma:7b && tail -f /dev/null"

  journey-mapper:
    build: .
    container_name: journey-mapper
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
      - ./sample_data:/app/sample_data
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

volumes:
  ollama_data: