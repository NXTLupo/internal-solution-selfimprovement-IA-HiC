<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXT Humans | Journey Mapper</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/nxt-humans-styles.css">
    <link rel="stylesheet" href="/static/nxt-header.css">
    <link rel="stylesheet" href="/static/app-header-thumbnails.css">
    <!-- Favicon declarations in proper order -->
    <link rel="shortcut icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/svg+xml" href="/static/route-favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/route-favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header class="intelligence-augmentation-header">
        <div class="ia-container has-thumbnail">
            <div class="ia-content">
                <div class="ia-logo-section">
                    <img src="/static/nxt-humans-logo.png?v=2" alt="NXT HUMANS Logo" class="ia-logo-image" onerror="fallbackLogo(this)">
                </div>
                <div class="ia-text-section">
                    <div class="ia-introducing">Intelligence Augmentation</div>
                    <div class="ia-main-text">
                        <div class="ia-intelligence">Journey</div>
                        <div class="ia-augmentation">Mapper</div>
                    </div>
                </div>
            </div>
            <div class="ia-thumbnail-section">
                <img src="/static/journey_mapper_4.gif" alt="Journey Mapper Claude 4 Demo" class="ia-app-thumbnail" />
                <div class="ia-thumbnail-label">Claude 4 Demo</div>
            </div>
        </div>
    </header>

    <div id="root"></div>
    <script src="/static/js/main.js"></script>
    
    <!-- App GIF Controls -->
    <script src="/static/app-gif-controls.js"></script>
    <script>
      // Progressive fallback for NXT HUMANS logo (local -> mounted launchpad -> Launchpad HTTP)
      function fallbackLogo(img) {
        const sources = [
          '/static/nxt-humans-logo.png',
          '/static/launchpad/nxt-humans-logo.png',
          'http://localhost:8000/static/nxt-humans-logo.png'
        ];
        const tried = parseInt(img.dataset.errIdx || '0', 10);
        if (tried >= sources.length - 1) return;
        img.dataset.errIdx = String(tried + 1);
        img.src = sources[tried + 1] + '?t=' + Date.now();
      }
    </script>
</body>
</html>
