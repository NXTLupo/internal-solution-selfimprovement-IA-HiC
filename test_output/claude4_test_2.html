
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>2025 Market Share by Segment</title>
            <script src="https://d3js.org/d3.v7.min.js"></script>
            <style>
                body {
                    margin: 0;
                    padding: 20px;
                    background: transparent;
                    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
                    color: #ffffff;
                    width: 1200px;
                    height: 1050px;
                    overflow: hidden;
                }
                
                .chart-container {
                    width: 100%;
                    height: 100%;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
                
                .chart-title {
                    font-size: 28px;
                    font-weight: 600;
                    margin-bottom: 20px;
                    text-align: center;
                    color: #ffffff;
                    text-shadow: 0 0 10px rgba(1, 196, 200, 0.3);
                }
                
                .chart-svg {
                    background: transparent;
                }
                
                .axis {
                    color: #ffffff;
                }
                
                .axis text {
                    fill: #ffffff;
                    font-size: 16px;
                }
                
                .axis path,
                .axis line {
                    stroke: rgba(255,255,255,0.15);
                    stroke-width: 1;
                }
                
                .grid line {
                    stroke: rgba(255,255,255,0.15);
                    stroke-width: 0.5;
                    stroke-dasharray: 3,3;
                }
                
                .tooltip {
                    position: absolute;
                    background: rgba(0, 0, 0, 0.8);
                    color: #ffffff;
                    padding: 8px 12px;
                    border-radius: 6px;
                    border: 1px solid #7c3aed;
                    font-size: 12px;
                    pointer-events: none;
                    opacity: 0;
                    transition: opacity 0.3s;
                }
            </style>
        </head>
        <body>
            <div class="chart-container">
                <div class="chart-title">2025 Market Share by Segment</div>
                <svg class="chart-svg" width="1160" height="970"></svg>
            </div>
            
            <script>
                
        const data = [{"label": "Enterprise", "value": 45}, {"label": "Mid-Market", "value": 35}, {"label": "SMB", "value": 20}];
        const svg = d3.select('.chart-svg');
        const radius = Math.min(1160, 970) / 2 - 40;
        const centerX = 1160 / 2;
        const centerY = 970 / 2;
        
        // Create color scale
        const colors = ['#7c3aed', '#01C4C8', '#06b6d4', 
                       '#ff6b6b', '#4ecdc4', '#45b7d1', '#f39c12', '#e74c3c'];
        const colorScale = d3.scaleOrdinal(colors);
        
        // Create pie generator
        const pie = d3.pie()
            .value(d => d.value)
            .sort(null);
        
        // Create arc generator
        const arc = d3.arc()
            .innerRadius(radius * 0.4)
            .outerRadius(radius);
        
        const arcHover = d3.arc()
            .innerRadius(radius * 0.4)
            .outerRadius(radius * 1.1);
        
        // Create chart group
        const chart = svg.append('g')
            .attr('transform', `translate(${centerX}, ${centerY})`);
        
        // Create tooltip
        const tooltip = d3.select('body').append('div')
            .attr('class', 'tooltip');
        
        // Create pie slices
        const slices = chart.selectAll('.slice')
            .data(pie(data))
            .enter()
            .append('g')
            .attr('class', 'slice');
        
        slices.append('path')
            .attr('d', arc)
            .attr('fill', (d, i) => colorScale(i))
            .attr('stroke', '#ffffff')
            .attr('stroke-width', 2)
            .style('filter', 'drop-shadow(0 0 8px rgba(1, 196, 200, 0.3))')
            .on('mouseover', function(event, d) {
                d3.select(this)
                    .transition()
                    .duration(200)
                    .attr('d', arcHover)
                    .style('filter', 'drop-shadow(0 0 12px rgba(1, 196, 200, 0.6))');
                    
                tooltip.transition()
                    .duration(200)
                    .style('opacity', 1);
                    
                const percentage = ((d.value / d3.sum(data, d => d.value)) * 100).toFixed(1);
                tooltip.html(`<strong>${d.data.label}</strong><br/>Value: ${d.data.value}<br/>Percentage: ${percentage}%`)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 28) + 'px');
            })
            .on('mouseout', function(d) {
                d3.select(this)
                    .transition()
                    .duration(200)
                    .attr('d', arc)
                    .style('filter', 'drop-shadow(0 0 8px rgba(1, 196, 200, 0.3))');
                    
                tooltip.transition()
                    .duration(500)
                    .style('opacity', 0);
            })
            .transition()
            .duration(1000)
            .delay((d, i) => i * 100)
            .attrTween('d', function(d) {
                const interpolate = d3.interpolate({startAngle: 0, endAngle: 0}, d);
                return function(t) {
                    return arc(interpolate(t));
                };
            });
        
        // Add labels
        slices.append('text')
            .attr('transform', d => `translate(${arc.centroid(d)})`)
            .attr('text-anchor', 'middle')
            .style('fill', '#ffffff')
            .style('font-size', '12px')
            .style('font-weight', 'bold')
            .style('text-shadow', '0 0 4px rgba(0,0,0,0.8)')
            .text(d => d.data.label)
            .style('opacity', 0)
            .transition()
            .duration(1000)
            .delay(800)
            .style('opacity', 1);
        
            </script>
        </body>
        </html>
