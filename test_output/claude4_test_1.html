
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Q4 2024 Revenue Performance</title>
            <script src="https://d3js.org/d3.v7.min.js"></script>
            <style>
                body {
                    margin: 0;
                    padding: 20px;
                    background: transparent;
                    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
                    color: #ffffff;
                    width: 1200px;
                    height: 1050px;
                    overflow: hidden;
                }
                
                .chart-container {
                    width: 100%;
                    height: 100%;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                }
                
                .chart-title {
                    font-size: 28px;
                    font-weight: 600;
                    margin-bottom: 20px;
                    text-align: center;
                    color: #ffffff;
                    text-shadow: 0 0 10px rgba(1, 196, 200, 0.3);
                }
                
                .chart-svg {
                    background: transparent;
                }
                
                .axis {
                    color: #ffffff;
                }
                
                .axis text {
                    fill: #ffffff;
                    font-size: 16px;
                }
                
                .axis path,
                .axis line {
                    stroke: rgba(255,255,255,0.15);
                    stroke-width: 1;
                }
                
                .grid line {
                    stroke: rgba(255,255,255,0.15);
                    stroke-width: 0.5;
                    stroke-dasharray: 3,3;
                }
                
                .tooltip {
                    position: absolute;
                    background: rgba(0, 0, 0, 0.8);
                    color: #ffffff;
                    padding: 8px 12px;
                    border-radius: 6px;
                    border: 1px solid #01C4C8;
                    font-size: 12px;
                    pointer-events: none;
                    opacity: 0;
                    transition: opacity 0.3s;
                }
            </style>
        </head>
        <body>
            <div class="chart-container">
                <div class="chart-title">Q4 2024 Revenue Performance</div>
                <svg class="chart-svg" width="1160" height="970"></svg>
            </div>
            
            <script>
                
        const data = [{"x": 1, "y": 2400000}, {"x": 2, "y": 2800000}, {"x": 3, "y": 3200000}, {"x": 4, "y": 3600000}];
        const svg = d3.select('.chart-svg');
        const margin = {top: 20, right: 30, bottom: 50, left: 60};
        const chartWidth = 1160 - margin.left - margin.right;
        const chartHeight = 970 - margin.top - margin.bottom;
        
        // Create scales
        const xScale = d3.scaleLinear()
            .domain(d3.extent(data, d => d.x))
            .range([0, chartWidth]);
            
        const yScale = d3.scaleLinear()
            .domain(d3.extent(data, d => d.y))
            .range([chartHeight, 0]);
        
        // Create chart group
        const chart = svg.append('g')
            .attr('transform', `translate(${margin.left}, ${margin.top})`);
        
        // Add grid lines
        chart.selectAll('.grid-line-y')
            .data(yScale.ticks())
            .enter()
            .append('line')
            .attr('class', 'grid-line-y')
            .attr('x1', 0)
            .attr('x2', chartWidth)
            .attr('y1', d => yScale(d))
            .attr('y2', d => yScale(d))
            .style('stroke', 'rgba(255,255,255,0.15)')
            .style('stroke-width', 0.5)
            .style('stroke-dasharray', '3,3');
        
        // Create line generator
        const line = d3.line()
            .x(d => xScale(d.x))
            .y(d => yScale(d.y))
            .curve(d3.curveMonotoneX);
        
        // Create gradient for line
        const gradient = svg.append('defs')
            .append('linearGradient')
            .attr('id', 'lineGradient')
            .attr('gradientUnits', 'userSpaceOnUse')
            .attr('x1', 0).attr('y1', 0)
            .attr('x2', chartWidth).attr('y2', 0);
            
        gradient.append('stop')
            .attr('offset', '0%')
            .attr('stop-color', '#01C4C8');
            
        gradient.append('stop')
            .attr('offset', '100%')
            .attr('stop-color', '#22c55e');
        
        // Add the line
        const path = chart.append('path')
            .datum(data)
            .attr('fill', 'none')
            .attr('stroke', 'url(#lineGradient)')
            .attr('stroke-width', 3)
            .attr('d', line)
            .style('filter', 'drop-shadow(0 0 8px rgba(1, 196, 200, 0.4))')
            .style('opacity', 0);
        
        // Animate line drawing
        const totalLength = path.node().getTotalLength();
        path
            .attr('stroke-dasharray', totalLength + ' ' + totalLength)
            .attr('stroke-dashoffset', totalLength)
            .style('opacity', 1)
            .transition()
            .duration(2000)
            .ease(d3.easeLinear)
            .attr('stroke-dashoffset', 0);
        
        // Add data points
        chart.selectAll('.dot')
            .data(data)
            .enter()
            .append('circle')
            .attr('class', 'dot')
            .attr('cx', d => xScale(d.x))
            .attr('cy', d => yScale(d.y))
            .attr('r', 0)
            .attr('fill', '#01C4C8')
            .attr('stroke', '#ffffff')
            .attr('stroke-width', 2)
            .style('filter', 'drop-shadow(0 0 6px rgba(1, 196, 200, 0.6))')
            .transition()
            .duration(500)
            .delay((d, i) => i * 100 + 1000)
            .attr('r', 5);
        
        // Add axes
        const xAxis = d3.axisBottom(xScale).tickSizeOuter(0);
        const yAxis = d3.axisLeft(yScale).tickSizeOuter(0);
        
        chart.append('g')
            .attr('class', 'axis')
            .attr('transform', `translate(0, ${chartHeight})`)
            .call(xAxis);
        
        chart.append('g')
            .attr('class', 'axis')
            .call(yAxis);
        
            </script>
        </body>
        </html>
