version: '3.8'

services:
  # HTTPS Proxy for secure connections
  https-proxy:
    image: nginx:alpine
    container_name: nxt-https-proxy
    ports:
      # HTTPS ports for each service
      - "8443:8443"   # Main Launchpad HTTPS
      - "8444:8444"   # Journey Mapper HTTPS
      - "8445:8445"   # OpenAI Journey Mapper HTTPS
      - "8446:8446"   # Reddit Data Collector HTTPS
      - "8447:8447"   # Social Research Tool HTTPS
      - "8448:8448"   # Video Transcriptor HTTPS
      - "8449:8449"   # LinkedIn Generator HTTPS
      - "8450:8450"   # Miro Generator HTTPS
    volumes:
      - ./ssl-certs:/etc/nginx/ssl:ro
      - ./nginx-simple.conf:/etc/nginx/nginx.conf:ro
    external_links:
      - nxthumans_ai_cx_workbench-launchpad-1:launchpad
      - nxthumans_ai_cx_workbench-journey-mapper-1:journey-mapper
      - nxthumans_ai_cx_workbench-openai-journey-mapper-1:openai-journey-mapper
      - nxthumans_ai_cx_workbench-reddit-ripper-1:reddit-ripper
      - nxthumans_ai_cx_workbench-social-research-1:social-research-frontend
      - nxthumans_ai_cx_workbench-video-analyzer-1:video-analyzer
      - nxthumans_ai_cx_workbench-linkedin-generator-1:linkedin-generator
      - nxthumans_ai_cx_workbench-miro-generator-1:miro-generator
    restart: unless-stopped

networks:
  default:
    external: true
    name: nxthumans_ai_cx_workbench_nxt-humans-network