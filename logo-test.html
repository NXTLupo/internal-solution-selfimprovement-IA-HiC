<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Test</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #1A1A1A;
      color: #FFFFFF;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      margin-bottom: 30px;
    }

    .logo-test {
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      width: 80%;
      max-width: 600px;
    }

    .logo-test h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .logo-test img {
      max-width: 100%;
      height: auto;
      border: 1px dashed #555;
      padding: 10px;
    }

    .logo-test p {
      margin-top: 10px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Logo Path Testing</h1>

  <div class="logo-container">
    <div class="logo-test">
      <h2>Absolute Path Test</h2>
      <img src="/Volumes/SSK SSD/NXT HUMANS_AI_CX_WORKBENCH/launchpad/static/nxt-humans-logo.png" alt="Absolute Path Test">
      <p>Full absolute path to the file</p>
    </div>

    <div class="logo-test">
      <h2>Relative Path Test (.)</h2>
      <img src="./launchpad/static/nxt-humans-logo.png" alt="Relative Path Test">
      <p>Relative path from current directory</p>
    </div>

    <div class="logo-test">
      <h2>Relative Path Test (no prefix)</h2>
      <img src="launchpad/static/nxt-humans-logo.png" alt="Relative Path Test No Prefix">
      <p>Relative path without ./ prefix</p>
    </div>
  </div>

  <p>If you can see the image in any of these tests, use that path format in your templates.</p>

</body>
</html>
